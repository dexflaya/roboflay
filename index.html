function applyEvoStats(fullHeal){
  let ev=EVOS[G.evoLine][G.evoIdx];
  G.maxHp=100+ev.def*4;
  G.hp=fullHeal?G.maxHp:Math.min(G.hp,G.maxHp);
}

function gameOver(reason){
  G.running=false;G.hp=0;
  renderUpgradeHud();
  let sec=Math.floor(G.gameTime/60);
  document.getElementById('go-reason').textContent=reason;
  document.getElementById('go-stats').innerHTML=
    `Уровень: ${G.level}<br>Убийств: ${G.kills}<br>Съедено: ${G.eats}<br>Комбо макс: ${G.combo}<br>Время: ${sec} сек`;
  document.getElementById('gameover-overlay').style.display='flex';
  setEasterEggMenuVisible(false);
  EasterEgg.stop();
  AudioFX.gameOver();
}

// === EVOLUTION & RELICS ===
function offerEvolution(){
  G.running=false;
  let ov=document.getElementById('evo-overlay');ov.style.display='flex';
  let ch=document.getElementById('evo-choices');ch.innerHTML='';
  let nextIdx=G.evoIdx+1;
  if(nextIdx>=EVOS[G.evoLine].length){G.running=true;ov.style.display='none';renderUpgradeHud();showMsg('Максимальная эволюция!');return;}
  let lines=['pyrox','cryobot','voltek','titan'],options=[G.evoLine];
  let cross=lines.filter(l=>l!==G.evoLine&&EVOS[l].length>nextIdx);
  if(cross.length&&Math.random()<.4)options.push(cross[Math.floor(Math.random()*cross.length)]);
  options.forEach(line=>{
    let ev=EVOS[line][nextIdx];
    let card=document.createElement('div');card.className='evo-card';
    let colors={pyrox:'#ff4400',cryobot:'#00cfff',voltek:'#ffee00',titan:'#d4af37'};
    card.style.borderColor=colors[line];
    let c2=document.createElement('canvas');c2.width=70;c2.height=70;
    drawRobot(c2.getContext('2d'),35,35,line,nextIdx,ev.size*.9,true,0);
    card.appendChild(c2);
    let h4=document.createElement('h4');h4.textContent=ev.name;h4.style.color=colors[line];
    card.appendChild(h4);
    card.appendChild(Object.assign(document.createElement('p'),{textContent:ev.desc}));
    card.onclick=()=>{
      G.evoLine=line;G.evoIdx=nextIdx;applyEvoStats();G.hp=G.maxHp;
      spawnParticles(G.px,G.py,colors[line],30);G.shakeT=20;
      AudioFX.evolution();
      ov.style.display='none';updateHudName();showMsg('Эволюция: '+ev.name+'!');
      G.running=true;renderUpgradeHud();
    };
    ch.appendChild(card);
  });
}

function updateRelicHudTag(){
  let tag=document.getElementById('relic-tag');
  if(!tag)return;
  if(!G.relics||!G.relics.length){tag.textContent='';return;}
  let names=G.relics.map(id=>{let r=RELICS.find(x=>x.id===id);return r?r.name:id;});
  tag.textContent='['+names.join(' · ')+']';
}

function applyRelicStacks(){
  G.relicBonus={dmgMult:1,shootMult:1,enRegenMult:1,speedMult:1,killHp:0};
  let droneNeed=0;
  for(let id of G.relics){
    if(id==='dmg20')G.relicBonus.dmgMult*=1.2;
    if(id==='firerate20')G.relicBonus.shootMult*=1.2;
    if(id==='stamina30')G.relicBonus.enRegenMult*=1.3;
    if(id==='speed10')G.relicBonus.speedMult*=1.1;
    if(id==='killhp10')G.relicBonus.killHp+=10;
    if(id==='drone')droneNeed++;
  }
  while(G.drones.length<droneNeed)spawnCompanionDrone();
}

function offerRelic(){
  G.running=false;
  let ov=document.getElementById('relic-overlay');ov.style.display='flex';
  let ch=document.getElementById('relic-choices');ch.innerHTML='';
  let picks=RELICS.sort(()=>Math.random()-.5).slice(0,3);
  picks.forEach(r=>{
    let card=document.createElement('div');card.className='relic-card';card.style.borderColor=r.color;
    bindMenuHover(card);
    let h=document.createElement('h4');h.textContent=r.name;h.style.color=r.color;
    let p=document.createElement('p');p.style.fontSize='10px';p.style.color='#aaa';p.textContent=r.desc;
    card.appendChild(h);card.appendChild(p);
    card.onclick=()=>{
      G.relics.push(r.id);
      applyRelicStacks();
      ov.style.display='none';
      G.running=true;
      AudioFX.uiClick();
      updateRelicHudTag();
      renderUpgradeHud();
      showMsg('Реликвия: '+r.name);
      if(G.xp>=G.xpNext)checkLevelUp();
    };
    ch.appendChild(card);
  });
}

function showMsg(t){
  let m=document.getElementById('msg');
  if(!m)return;
  m.textContent=t;
  m.style.opacity=1;
  if(G.running&&G.evoLine&&EVOS[G.evoLine]&&EVOS[G.evoLine][G.evoIdx]){
    let ev=EVOS[G.evoLine][G.evoIdx];
    m.style.top=(gc.height/2-ev.size-52)+'px';
    m.style.transform='translate(-50%,0)';
    m.classList.add('msg-hud');
  }else{
    m.style.top='45%';
    m.style.transform='translate(-50%,-50%)';
    m.classList.remove('msg-hud');
  }
  clearTimeout(showMsg._hideT);
  showMsg._hideT=setTimeout(()=>m.style.opacity=0,2200);
}
function updateHudName(){
  document.getElementById('rname').textContent=EVOS[G.evoLine][G.evoIdx].name;
  document.getElementById('lvl').textContent=G.level;
  let lx=document.getElementById('lvl-xp');
  if(lx)lx.textContent=G.level;
}

// === UPDATE ===
function update(){
  if(!G.running)return;
  if(!G.evoLine||!EVOS[G.evoLine])return;
  if(G.paused){updateHUD();return;}
  G.gameTime++;
  if(G.lightningArcs){
    for(let li=G.lightningArcs.length-1;li>=0;li--){
      G.lightningArcs[li].life--;
      if(G.lightningArcs[li].life<=0)G.lightningArcs.splice(li,1);
    }
  }
  let ev=EVOS[G.evoLine][G.evoIdx];
  let spd=ev.speed*getPlayerSpeedMult();
  let playerBiome=getBiomeAt(G.px,G.py);
  let nativeBiome={pyrox:0,cryobot:1,voltek:2,titan:0}[G.evoLine];
  if(playerBiome>=0&&playerBiome<=3&&playerBiome!==nativeBiome){
    if(playerBiome===1&&(G.evoLine==='pyrox'||G.evoLine==='titan'))spd*=.84;
    if(playerBiome===0&&G.evoLine==='cryobot'&&G.gameTime%BIOME_ENV_TICK===0){applyBiomeEnvDamage(2.6);spd*=.88;}
    if(playerBiome!==nativeBiome&&G.evoLine==='voltek')spd*=.93;
  }
  if(G.speedBoostT>0){spd*=1.35;G.speedBoostT--;}

  if(G.dashActive)updateDash();

  let aim=aimFromPlayer();
  let moving=aim.dist>22&&!G.dashActive;
  if(moving&&!G.mouseOverUpgradeHud){
    let nx=aim.dx/aim.dist,ny=aim.dy/aim.dist;
    let moveMult=screenMoveSpeedMult();
    let mx=nx*spd*1.85*moveMult,my=ny*spd*1.85*moveMult;
    let z=zoneAt(G.px,G.py);
    if(z&&(z.type==='iceslide'||z.type==='speedpad')){G.iceVelX=G.iceVelX*.94+mx*.09;G.iceVelY=G.iceVelY*.94+my*.09;mx+=G.iceVelX;my+=G.iceVelY;}
    else{G.iceVelX*=.9;G.iceVelY*=.9;}
    let cp=clampMapPos(G.px+mx,G.py+my,ev.size);
    G.px=cp.x;G.py=cp.y;
    G.playerState='move';
  }else{
    let ev=EVOS[G.evoLine]&&EVOS[G.evoLine][G.evoIdx];
    G.playerState=G.mouseDown?(ev&&ev.meleeOnly?'melee':'shoot'):'idle';
  }
  G.moveVel=moving?1:0;G.animT++;

  let z=zoneAt(G.px,G.py);
  G.inSafeZone=z&&z.type==='safe';
  if(G.inSafeZone){
    G.playerState='idle';
    if(G.gameTime%3===0){
      G.hp=Math.min(G.maxHp,G.hp+1.35);
      G.energy=Math.min(G.maxEnergy,G.energy+1.15);
    }
    if(G.drones){
      for(let d of G.drones){
        if(d.alive&&d.hp<d.maxHp)d.hp=Math.min(d.maxHp,d.hp+COMPANION_DRONE.safeRegen);
      }
    }
  }

  if(z&&(z.type==='pyramid'||z.type==='coral')&&!G.inSafeZone&&G.gameTime%8===0){
    applyDamageToPlayer((z.dmg||25)*0.4);
    G.shakeT=7;
    if(G.gameTime%24===0)AudioFX.hazard();
  }

  let hz=hazardAt(G.px,G.py);
  if(hz&&!G.inSafeZone&&G.gameTime%6===0){
    let hzMult=(playerBiome===4||playerBiome===5)?1.5:1;
    applyDamageToPlayer(hz.dmg*0.34*hzMult);G.shakeT=6;
    if(G.gameTime%18===0)AudioFX.hazard();
  }

  if(z){
    if(z.type==='geyser'&&G.gameTime%30===0){
      if(Math.random()<.25)applyDamageToPlayer(5);
      for(let j=G.enemies.length-1;j>=0;j--){
        let e=G.enemies[j];
        let ddx=e.x-z.x,ddy=e.y-z.y;
        if(ddx*ddx+ddy*ddy<z.r*z.r)dealDamageToEnemy(e,4,true);
      }
    }
    if(z.type==='turbine'){let a=Math.atan2(G.py-z.y,G.px-z.x);G.px+=Math.cos(a)*.5;G.py+=Math.sin(a)*.5;}
    if(z.type==='nexusaltar'&&!G.nexusSpawned&&G.kills>=35&&G.gameTime%150===0)trySpawnNexus();
  }
  if(playerBiome===3&&G.gameTime%BIOME_ENV_TICK===0){applyBiomeEnvDamage(2.2);spd*=.92;}

  G.camTX=G.px-gc.width/2;G.camTY=G.py-gc.height/2;
  let camLerp=G.dashActive?0.32:CAM_LERP;
  G.camX+=(G.camTX-G.camX)*camLerp;G.camY+=(G.camTY-G.camY)*camLerp;

  syncPlayerEnergy(false);
  G.energy=Math.min(G.maxEnergy,G.energy+.05*getPlayerEnRegenMult());
  updateCompanionDrones(ev);
  if(G.dashCd>0)G.dashCd--;
  if(G.dashCd===0&&!G.inSafeZone&&!G.dashActive){
    if(G.rmbDown)playerBoost(true);
    else if(G.spaceHeld)playerBoost(false);
  }
  if(G.shootCd>0)G.shootCd--;
  if(G.meleeCd>0)G.meleeCd--;
  if(G.nodeCd>0)G.nodeCd--;
  if(G.overchargeT>0)G.overchargeT--;
  if(G.comboTimer>0){G.comboTimer--;if(G.comboTimer<=0)G.combo=0;}
  let comboEl=document.getElementById('combo');
  if(G.combo>2){comboEl.textContent='COMBO x'+G.combo;comboEl.style.opacity=1;}else comboEl.style.opacity=0;

  if(G.mouseDown&&!G.inSafeZone){
    let ev=EVOS[G.evoLine][G.evoIdx];
    if(ev&&ev.meleeOnly){
      G.swordHoldT=Math.min(SWORD_CHARGE_FRAMES,(G.swordHoldT||0)+1);
      if(G.meleeCd===0)playerSword(aim.angle,G.specialDown);
    }else{
      G.swordHoldT=Math.max(0,(G.swordHoldT||0)-6);
      if(G.shootCd===0)playerShoot(aim.angle,G.specialDown);
    }
  }else{
    G.swordHoldT=Math.max(0,(G.swordHoldT||0)-5);
  }

  G.spawnTimer++;G.foodTimer++;
  if(G.spawnTimer>154){
    G.spawnTimer=0;
    if(G.enemies.length<36)spawnEnemy();
    else if(G.regionsUnlocked&&G.enemies.length<46&&Math.random()<0.55)spawnEnemyInExtension();
  }
  if(G.foodTimer>100){G.foodTimer=0;if(G.foods.length<50)spawnFood();}

  // Pickups
  for(let i=G.pickups.length-1;i>=0;i--){
    let p=G.pickups[i];p.life--;
    if(Math.hypot(p.x-G.px,p.y-G.py)<ev.size+p.r){
      if(p.type==='speed')G.speedBoostT=280;
      if(p.type==='overcharge')G.overchargeT=260;
      showMsg(p.label+'!');
      AudioFX.pickup();
      G.pickups.splice(i,1);continue;
    }
    if(p.life<=0)G.pickups.splice(i,1);
  }

  // Food
  for(let i=G.foods.length-1;i>=0;i--){
    let f=G.foods[i];
    if(Math.hypot(f.x-G.px,f.y-G.py)<ev.size+f.size){
      G.xp+=f.xp;G.eats++;G.energy=Math.min(G.maxEnergy,G.energy+12);G.hp=Math.min(G.maxHp,G.hp+3);
      spawnFloat(f.x,f.y-10,'+'+f.xp+' XP','#5f5',false);
      spawnParticles(f.x,f.y,BIOMES[f.biome].food,6);G.foods.splice(i,1);
      AudioFX.foodEat();
      document.getElementById('eatcount').textContent=G.eats;checkLevelUp();
    }
  }

  // Bullets player
  for(let i=G.bullets.length-1;i>=0;i--){
    let b=G.bullets[i];
    if(b.homing&&!b.homingPassed&&b.homingTarget){
      let t=b.homingTarget;
      if(!G.enemies.includes(t)||t.hp<=0)b.homing=false;
      else{
        let dx=t.x-b.x,dy=t.y-b.y,dist=Math.hypot(dx,dy);
        let cur=Math.atan2(b.vy,b.vx),want=Math.atan2(dy,dx);
        let diff=Math.atan2(Math.sin(want-cur),Math.cos(want-cur));
        let spd=Math.hypot(b.vx,b.vy)||COMPANION_DRONE.bulletSpeed;
        let turn=b.homingTurn||COMPANION_DRONE.homingTurn;
        let na=cur+diff*turn;
        b.vx=Math.cos(na)*spd;b.vy=Math.sin(na)*spd;
        if(dist<t.size+(b.r||4)+6&&b.vx*dx+b.vy*dy<0)b.homingPassed=true;
      }
    }
    b.x+=b.vx;b.y+=b.vy;b.life--;
    let bb=mapPlayBounds();
    if(b.x<bb.left||b.x>bb.right||b.y<bb.top||b.y>bb.bottom||b.life<=0){G.bullets.splice(i,1);continue;}
    let hit=false;
    for(let e of G.enemies){
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.size+b.r){
        dealDamageToEnemy(e,b.dmg,true);
        applyBulletElement(e,b);
        if(!b.pierce){hit=true;break;}
        b.pierce--;
      }
    }
    if(hit)G.bullets.splice(i,1);
  }

  // Enemy bullets
  for(let i=G.enemyBullets.length-1;i>=0;i--){
    let b=G.enemyBullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    let hitPlayer=false;
    if(Math.hypot(b.x-G.px,b.y-G.py)<ev.size+b.r){
      applyDamageToPlayer(b.dmg);
      G.shakeT=8;hitPlayer=true;
    }
    if(!hitPlayer&&G.drones){
      for(let d of G.drones){
        if(!d.alive)continue;
        if(Math.hypot(b.x-d.x,b.y-d.y)<COMPANION_DRONE.size+(b.r||4)){
          damageCompanionDrone(d,b.dmg);
          hitPlayer=true;
          break;
        }
      }
    }
    if(hitPlayer){G.enemyBullets.splice(i,1);continue;}
    let bb=mapPlayBounds();
    if(b.x<bb.left||b.x>bb.right||b.y<bb.top||b.y>bb.bottom||b.life<=0)G.enemyBullets.splice(i,1);
  }

  // Enemies
  for(let i=G.enemies.length-1;i>=0;i--){
    let e=G.enemies[i];
    if(e.spawnGrace>0)e.spawnGrace--;
    let d=Math.hypot(e.x-G.px,e.y-G.py);
    let espd=e.speed*getEnemySpeedMult(e);
    if(e.slowT>0)e.slowT--;
    if(e.iceStacks>0&&G.gameTime%24===0){
      e.iceStacks=Math.max(0,e.iceStacks-0.2);
      e.iceSlow=Math.min(ICE_SLOW_MAX,e.iceStacks*ICE_SLOW_PER_HIT);
      e.freezeTint=e.iceStacks>0.3?Math.min(1,e.iceStacks/9):0;
      if(e.iceStacks<=0){e.iceSlow=0;e.freezeTint=0;}
    }
    if(isEnemyBurning(e)){
      if(G.gameTime%4===0)spawnBurnParticle(e.x,e.y,e.size);
      if(G.gameTime%22===0){
        e.hp-=BURN_TICK_DMG;
        if(e.hp<=0){killEnemy(e,false);continue;}
      }
    }else{
      e.burnUntil=0;
      e.burnStacks=0;
    }
    if(e.hitFlash>0)e.hitFlash--;

    let detect=G.inSafeZone?0:(e.boss||e.nexus?620:e.miniBoss?520:420);
    let aggro=G.gameTime-(e.lastHitTime||-9999)<280;
    if(aggro||d<detect)e.state='chase';
    else if(e.state==='chase'&&d>detect+100)e.state='patrol';

    if(e.turret){
      e.x=CORE_ZONE.cx;e.y=CORE_ZONE.cy;
      let playerInCore=isInCore(G.px,G.py);
      if(playerInCore)G.turretAggroUntil=G.gameTime+TURRET_GRACE_FRAMES;
      let turretActive=playerInCore||G.gameTime<G.turretAggroUntil;
      if(G.gameTime-(e.lastHitTime||0)>TURRET_REGEN_DELAY){
        e.hp=Math.min(e.maxHp,e.hp+e.maxHp*.003);
      }
      if(turretActive){
        e.attackCd--;
        if(e.attackCd<=0){turretAttack(e);e.attackCd=62+e.phase*10;}
      }else if(e.attackCd>0)e.attackCd--;
      continue;
    }

    if(e.isSquadLeader){
      e.shootCd--;
      if(e.state==='chase'&&e.shootCd<=0&&d<420&&d>50){
        enemySquadLeaderShoot(e);
        e.shootCd=(e.shootCdBase||92)+Math.floor(Math.random()*35);
      }
      moveEnemyAI(e,espd,d);
    }else if(e.squadMinion){
      e.shootCd--;
      if(e.state==='chase'&&e.shootCd<=0&&d<320&&d>35){
        enemySquadMinionShoot(e);
        e.shootCd=(e.shootCdBase||145)+Math.floor(Math.random()*50);
      }
      moveEnemyAI(e,espd,d);
    }else if(e.meleeSword){
      updateEnemyMelee(e,d,espd);
      if((e.boss||e.nexus)&&!e.turret){
        e.attackCd--;
        if(e.attackCd<=0){e.attackCd=e.nexus?55:90-e.phase*12;bossAttack(e,d);}
      }
      continue;
    }else if(e.shooter&&!e.boss&&!e.nexus){
      e.shootCd--;
      if(e.state==='chase'&&e.shootCd<=0&&d<400&&d>45){
        enemyShoot(e);
        e.shootCd=(e.shootCdBase||100)+Math.floor(Math.random()*30);
      }
      moveEnemyAI(e,espd,d);
    }else{
      moveEnemyAI(e,espd,d);
    }

    if((e.boss||e.nexus)&&!e.turret){
      e.attackCd--;
      if(e.attackCd<=0){
        e.attackCd=e.nexus?55:90-e.phase*12;
        bossAttack(e,d);
      }
    }
  }

  separateEnemies();

  if(!G.inSafeZone){
    for(let e of G.enemies)resolvePlayerEnemyContact(e,ev);
  }

  // Particles & float text
  for(let i=G.particles.length-1;i>=0;i--){
    let p=G.particles[i];
    if(p.lineTo){/* drawn in render */p.life--;if(p.life<=0)G.particles.splice(i,1);continue;}
    p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.life--;p.r*=.97;
    if(p.life<=0)G.particles.splice(i,1);
  }
  for(let i=G.floatTexts.length-1;i>=0;i--){
    let f=G.floatTexts[i];f.y+=f.vy;f.life--;
    if(f.life<=0)G.floatTexts.splice(i,1);
  }

  updateShieldRegen();
  syncPlayerShield(false);
  updateUpgradePanelVisibility();
  if(G.shakeT>0)G.shakeT--;
  updateSwordSwipes();
  for(let f of G.foods){
    if(!isInsidePlayBounds(f.x,f.y,8)){
      let p=randomSpawnInBiome(f.biome);
      f.x=p.x;f.y=p.y;
    }
  }
  for(let p of G.pickups){
    if(!isInsidePlayBounds(p.x,p.y,p.r||11)){
      let c=clampSpawnPos(p.x,p.y,p.r||11);
      p.x=c.x;p.y=c.y;
    }
  }
  updateHUD();
}

function addEnemyBullet(b){
  if(G.enemyBullets.length>=MAX_ENEMY_BULLETS)G.enemyBullets.shift();
  G.enemyBullets.push(b);
}

function bossAttack(e,d){
  AudioFX.bossAttack();
  let ang=Math.atan2(G.py-e.y,G.px-e.x);
  let sc=playerDmgScale(e);
  if(e.nexus){
    e.elementPhase=((e.elementPhase||0)+1)%3;
    let colors=['#f40','#8ef','#ff0'];
    let n=4+e.phase;
    for(let i=0;i<n;i++){
      let a=ang+i*(Math.PI*2/n);
      addEnemyBullet({x:e.x,y:e.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,dmg:e.atk*.17*sc,life:90,color:colors[e.elementPhase],r:4});
    }
  }else if(e.phase>=3){
    for(let i=0;i<8;i++){let a=i*Math.PI/4;addEnemyBullet({x:e.x,y:e.y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,dmg:e.atk*.15*sc,life:80,color:e.color,r:4});}
  }else if(e.phase>=2){
    addEnemyBullet({x:e.x,y:e.y,vx:Math.cos(ang)*4.5,vy:Math.sin(ang)*4.5,dmg:e.atk*.21*sc,life:75,color:e.color,r:5});
    addEnemyBullet({x:e.x,y:e.y,vx:Math.cos(ang+.35)*3.5,vy:Math.sin(ang+.35)*3.5,dmg:e.atk*.17*sc,life:65,color:e.color,r:4});
  }else{
    addEnemyBullet({x:e.x,y:e.y,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,dmg:e.atk*.2*sc,life:70,color:e.color,r:4});
  }
}

function checkLevelUp(){
  if(G.xp<G.xpNext||!G.running)return;
  G.xp-=G.xpNext;G.level++;G.xpNext=Math.floor(G.xpNext*1.35);
  G.upgradePoints++;
  updateHudName();
  showUpgradePanelOnLevelUp();
  renderUpgradeHud();
  showMsg('Уровень '+G.level+'! +1 прокачка');
  AudioFX.levelUp();
  if(G.level%4===0){offerRelic();return;}
  if(G.level%3===0){offerEvolution();return;}
  if(G.xp>=G.xpNext)checkLevelUp();
}

function updateHUD(){
  document.getElementById('hp-fill').style.width=(G.hp/G.maxHp*100)+'%';
  document.getElementById('xp-fill').style.width=(G.xp/G.xpNext*100)+'%';
  document.getElementById('en-fill').style.width=(G.energy/G.maxEnergy*100)+'%';
  let sb=document.getElementById('shield-bar');
  let shLv=G.upgrades.shield;
  if(shLv<=0)sb.style.display='none';
  else{
    sb.style.display='flex';
    let shBar=sb.querySelector('.bar');
    if(shBar)shBar.style.width=getShieldBarWidth()+'px';
    let shMax=getPlayerShieldMax();
    document.getElementById('shield-fill').style.width=(shMax>0?Math.min(100,G.shield/shMax*100):0)+'%';
  }
  let nf=document.getElementById('node-fill');
  nf.style.width=Math.max(0,100-G.nodeCd/NODE_CD*100)+'%';
  nf.style.opacity=G.nodeCd>0?'0.85':'1';
}

// === RENDER ===
function drawBiomeColumn(ctx,bi,x0,x1,vL,vR,vT,vB){
  let bm=BIOMES[bi],vw=gc.width,vh=gc.height;
  if(x1<vL||x0>vR)return;
  let sx=x0-G.camX,sw=x1-x0;
  let clip0=0,clip1=WORLD_H;
  if(bi===4){clip0=0;clip1=MIDDLE_Y0;}
  if(bi===5){clip0=MIDDLE_Y0+MIDDLE_H;clip1=WORLD_H;}
  let wy0=Math.max(clip0,vT),wy1=Math.min(clip1,vB);
  let sy0=wy0-G.camY,sy1=wy1-G.camY;
  let sh=sy1-sy0;
  if(sh<=0)return;
  ctx.fillStyle=bm.bg;
  ctx.fillRect(sx,sy0,sw,sh);
  if(bm.sand||bi===4){
    ctx.fillStyle='rgba(220,170,40,0.12)';
    ctx.fillRect(sx,sy0,sw,sh);
  }
  if(bm.ocean||bi===5){
    ctx.fillStyle='rgba(30,180,220,0.1)';
    ctx.fillRect(sx,sy0,sw,sh);
  }
  ctx.save();
  ctx.globalAlpha=0.16;
  ctx.strokeStyle=bm.grid;
  ctx.lineWidth=1;
  let gx0=Math.max(x0,Math.floor(vL/GRID_STEP)*GRID_STEP);
  let gx1=Math.min(x1,vR);
  for(let gx=gx0;gx<=gx1;gx+=GRID_STEP){
    let lx=gx-G.camX;
    if(lx<-20||lx>vw+20)continue;
    ctx.beginPath();ctx.moveTo(lx,sy0);ctx.lineTo(lx,sy1);ctx.stroke();
  }
  let gy0=Math.max(clip0,Math.floor(vT/GRID_STEP)*GRID_STEP);
  let gy1=Math.min(clip1,vB);
  for(let gy=gy0;gy<=gy1;gy+=GRID_STEP){
    let ly=gy-G.camY;
    if(ly<sy0-20||ly>sy1+20)continue;
    ctx.beginPath();ctx.moveTo(Math.max(sx,0),ly);ctx.lineTo(Math.min(sx+sw,vw),ly);ctx.stroke();
  }
  // Dashed squares across the whole world (subtle but visible)
  ctx.globalAlpha=0.17;
  ctx.strokeStyle='rgba(220,230,255,0.35)';
  ctx.setLineDash([5,9]);
  let step=GRID_STEP*2;
  let qx0=Math.max(x0,Math.floor(vL/step)*step);
  let qx1=Math.min(x1,vR);
  let qy0=Math.max(clip0,Math.floor(vT/step)*step);
  let qy1=Math.min(clip1,vB);
  for(let qx=qx0;qx<=qx1;qx+=step){
    for(let qy=qy0;qy<=qy1;qy+=step){
      let rx=qx-G.camX,ry=qy-G.camY;
      if(rx<-step||rx>vw+step||ry<-step||ry>vh+step)continue;
      ctx.strokeRect(rx,ry,step,step);
    }
  }
  ctx.setLineDash([]);
  ctx.restore();
  if(sx>-80&&sx<160&&sy0<40){
    ctx.fillStyle=bm.accent+'99';ctx.font='bold 14px Courier New';
    ctx.fillText(bm.name,sx+12,Math.max(22,sy0+18));
  }
}

function drawMapBorders(ctx){
  const pb=mapPlayBounds(),vw=gc.width,vh=gc.height;
  let sx=pb.left-G.camX,ex=pb.right-G.camX,ty=pb.top-G.camY,by=pb.bottom-G.camY;
  ctx.strokeStyle='#ffffff44';ctx.lineWidth=2;ctx.setLineDash([14,10]);
  if(ty>-8&&ty<vh+8){ctx.beginPath();ctx.moveTo(sx,ty);ctx.lineTo(ex,ty);ctx.stroke();}
  if(by>-8&&by<vh+8){ctx.beginPath();ctx.moveTo(sx,by);ctx.lineTo(ex,by);ctx.stroke();}
  if(sx>-8&&sx<vw+8){ctx.beginPath();ctx.moveTo(sx,ty);ctx.lineTo(sx,by);ctx.stroke();}
  if(ex>-8&&ex<vw+8){ctx.beginPath();ctx.moveTo(ex,ty);ctx.lineTo(ex,by);ctx.stroke();}
  for(let i=1;i<3;i++){
    let lx=BIOME_BOUNDS[i].x-G.camX;
    if(lx>-8&&lx<vw+8){ctx.beginPath();ctx.moveTo(lx,ty);ctx.lineTo(lx,by);ctx.stroke();}
  }
  if(G.regionsUnlocked){
    let tyD=MIDDLE_Y0-G.camY,tyW=MIDDLE_Y0+MIDDLE_H-G.camY;
    ctx.strokeStyle='#e8c04066';
    if(tyD>-8&&tyD<vh+8){ctx.beginPath();ctx.moveTo(sx,tyD);ctx.lineTo(ex,tyD);ctx.stroke();}
    if(tyW>-8&&tyW<vh+8){ctx.beginPath();ctx.moveTo(sx,tyW);ctx.lineTo(ex,tyW);ctx.stroke();}
  }
  ctx.setLineDash([]);
}

function drawBiomeBg(ctx){
  const vw=gc.width,vh=gc.height,m=GRID_STEP*2;
  const vL=G.camX-m,vR=G.camX+vw+m,vT=G.camY-m,vB=G.camY+vh+m;
  if(G.regionsUnlocked){
    drawBiomeColumn(ctx,4,0,WORLD_W,vL,vR,vT,vB);
    drawBiomeColumn(ctx,5,0,WORLD_W,vL,vR,vT,vB);
  }else if(vT<MIDDLE_Y0||vB>MIDDLE_Y0+MIDDLE_H){
    ctx.fillStyle='#1a1508';
    if(vT<MIDDLE_Y0)ctx.fillRect(0,0,vw,MIDDLE_Y0-G.camY);
    if(vB>MIDDLE_Y0+MIDDLE_H){
      let y0=MIDDLE_Y0+MIDDLE_H-G.camY;
      ctx.fillRect(0,y0,vw,vh-y0);
    }
  }
  const cols=[
    {bi:0,x0:0,x1:BIOME_BOUNDS[0].x+BIOME_BOUNDS[0].w},
    {bi:1,x0:BIOME_BOUNDS[1].x,x1:BIOME_BOUNDS[1].x+BIOME_BOUNDS[1].w},
    {bi:2,x0:BIOME_BOUNDS[2].x,x1:WORLD_W}
  ];
  for(let c of cols)drawBiomeColumn(ctx,c.bi,c.x0,c.x1,vL,vR,vT,vB);
  let ccx=CORE_ZONE.cx-G.camX,ccy=CORE_ZONE.cy-G.camY;
  if(ccx+CORE_ZONE.r>0&&ccx-CORE_ZONE.r<vw){
    ctx.fillStyle=BIOMES[3].bg;
    ctx.beginPath();ctx.arc(ccx,ccy,CORE_ZONE.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#d0f8';ctx.lineWidth=3;ctx.setLineDash([8,6]);
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#f0f6';ctx.font='bold 13px Courier New';ctx.textAlign='center';
    ctx.fillText('ЯДРО',ccx,ccy-CORE_ZONE.r+18);ctx.textAlign='left';
  }
  drawMapBorders(ctx);
}

function render(){
  let ox=0,oy=0;
  if(GameSettings.screenShake&&G.shakeT>0){ox=(Math.random()-.5)*6;oy=(Math.random()-.5)*6;}
  gctx.save();gctx.translate(ox,oy);
  gctx.clearRect(0,0,gc.width,gc.height);
  const onMenu=!G.running&&document.getElementById('overlay').style.display!=='none';
  const onGo=document.getElementById('gameover-overlay').style.display!=='none';
  if(onMenu&&!onGo){gctx.restore();return;}

  drawBiomeBg(gctx);
  drawMapDecor(gctx);

  const m=60;
  for(let f of G.foods){
    let sx=f.x-G.camX,sy=f.y-G.camY;
    if(sx<-m||sx>gc.width+m||sy<-m||sy>gc.height+m)continue;
    drawFood(gctx,sx,sy,f.biome,f.size);
  }

  for(let p of G.pickups){
    let sx=p.x-G.camX,sy=p.y-G.camY;
    if(sx<-m||sx>gc.width+m||sy<-m||sy>gc.height+m)continue;
    let meta=PICKUP_META[p.type];
    gctx.fillStyle=meta.color;
    gctx.beginPath();gctx.arc(sx,sy,p.r,0,Math.PI*2);gctx.fill();
    gctx.fillStyle='#fff';gctx.font='bold 12px Courier New';gctx.textAlign='center';
    gctx.fillText(p.label||meta.name,sx,sy-p.r-8);
    gctx.textAlign='left';
  }

  for(let b of G.bullets){
    let sx=b.x-G.camX,sy=b.y-G.camY;
    if(sx<-m||sx>gc.width+m||sy<-m||sy>gc.height+m)continue;
    gctx.fillStyle=b.color;
    gctx.beginPath();gctx.arc(sx,sy,b.r,0,Math.PI*2);gctx.fill();
  }
  for(let b of G.enemyBullets){
    let sx=b.x-G.camX,sy=b.y-G.camY;
    if(sx<-m||sx>gc.width+m||sy<-m||sy>gc.height+m)continue;
    gctx.fillStyle=b.color||'#f44';
    gctx.beginPath();gctx.arc(sx,sy,b.r||4,0,Math.PI*2);gctx.fill();
    gctx.strokeStyle='#fff2';gctx.lineWidth=1;
    gctx.beginPath();gctx.arc(sx,sy,b.r||4,0,Math.PI*2);gctx.stroke();
  }

  for(let e of G.enemies){
    let sx=e.x-G.camX,sy=e.y-G.camY;
    if(sx<-80||sx>gc.width+80||sy<-80||sy>gc.height+80)continue;
    drawEnemyShape(gctx,sx,sy,e,e.hitFlash>0);
    let bw=e.size*2.2;
    gctx.fillStyle='#222';gctx.fillRect(sx-bw/2,sy-e.size-12,bw,5);
    gctx.fillStyle=e.boss?'#f00':e.color;gctx.fillRect(sx-bw/2,sy-e.size-12,bw*(e.hp/e.maxHp),5);
    if(e.turret||e.boss||e.miniBoss||e.shooter||e.squadLeader){
      gctx.fillStyle='#fffc';gctx.font='11px Courier New';gctx.textAlign='center';
      gctx.fillText(e.name+(e.phase>1?' P'+e.phase:''),sx,sy-e.size-16);gctx.textAlign='left';
    }
  }

  for(let arc of G.lightningArcs||[]){
    let pts=arc.points;
    if(!pts||pts.length<2)continue;
    let al=Math.min(1,(arc.life||1)/14);
    gctx.save();
    gctx.globalAlpha=al;
    gctx.lineCap='round';gctx.lineJoin='round';
    gctx.strokeStyle=arc.color||'#e8f4ff';
    gctx.lineWidth=(arc.width||2.2)+1.5;
    gctx.shadowColor='#aaf';gctx.shadowBlur=8;
    gctx.beginPath();
    gctx.moveTo(pts[0].x-G.camX,pts[0].y-G.camY);
    for(let j=1;j<pts.length;j++)gctx.lineTo(pts[j].x-G.camX,pts[j].y-G.camY);
    gctx.stroke();
    gctx.shadowBlur=0;
    gctx.lineWidth=arc.width||2.2;
    gctx.strokeStyle='#fff';
    gctx.globalAlpha=al*0.85;
    gctx.stroke();
    gctx.restore();
  }

  for(let p of G.particles){
    if(p.lineTo){
      let sx=p.x-G.camX,sy=p.y-G.camY,ex=p.lineTo.x-G.camX,ey=p.lineTo.y-G.camY;
      gctx.strokeStyle=p.color;gctx.lineWidth=2;
      gctx.beginPath();gctx.moveTo(sx,sy);gctx.lineTo(ex,ey);gctx.stroke();continue;
    }
    let sx=p.x-G.camX,sy=p.y-G.camY;
    if(sx<-m||sx>gc.width+m)continue;
    gctx.globalAlpha=Math.min(1,p.life/25);
    gctx.fillStyle=p.color;
    gctx.beginPath();gctx.arc(sx,sy,p.r,0,Math.PI*2);gctx.fill();
    gctx.globalAlpha=1;
  }

  for(let f of G.floatTexts){
    let sx=f.x-G.camX,sy=f.y-G.camY;
    if(sx<-20||sx>gc.width+20)continue;
    gctx.font=(f.crit?'bold 14px':'11px')+' Courier New';
    gctx.fillStyle=f.color;gctx.globalAlpha=Math.min(1,f.life/40);
    gctx.fillText(f.text,sx,sy);
  }
  resetCtx(gctx);

  if(G.drones&&G.drones.length){
    for(let d of G.drones){
      let sx, sy, a=d.spawnAlpha||0;
      if(!d.alive){
        sx=G.px-G.camX+Math.cos(G.gameTime*.12)*14;
        sy=G.py-G.camY+Math.sin(G.gameTime*.12)*14;
        a=0.2+Math.sin(G.gameTime*.25)*0.15;
      }else{
        sx=d.x-G.camX;sy=d.y-G.camY;
      }
      gctx.save();
      gctx.globalAlpha=a;
      gctx.fillStyle='#2a5';
      gctx.strokeStyle='#8f8';
      gctx.lineWidth=2;
      gctx.beginPath();
      gctx.arc(sx,sy,COMPANION_DRONE.size,0,Math.PI*2);
      gctx.fill();gctx.stroke();
      gctx.fillStyle='#afa';
      gctx.beginPath();gctx.arc(sx,sy-2,COMPANION_DRONE.size*.35,0,Math.PI*2);gctx.fill();
      if(d.alive&&d.hp>0){
        let bw=COMPANION_DRONE.size*2.5;
        gctx.fillStyle='#111';gctx.fillRect(sx-bw/2,sy-COMPANION_DRONE.size-11,bw,4);
        gctx.fillStyle='#5f5';gctx.fillRect(sx-bw/2,sy-COMPANION_DRONE.size-11,bw*(d.hp/d.maxHp),4);
      }
      gctx.restore();
    }
  }

  if(G.evoLine&&EVOS[G.evoLine]){
    let ev=EVOS[G.evoLine][G.evoIdx];
    let angle=aimFromPlayer().angle;
    let bob=1+Math.sin(G.animT*.15)*.04*G.moveVel;
    let recoil=G.playerState==='shoot'?Math.min(1,G.shootCd/8):0;
    let px=gc.width/2,py=gc.height/2;
    let hbw=ev.size*2.2;
    let hpY=py-ev.size-18;
    if(G.playerNick){
      gctx.fillStyle='#9ab';
      gctx.font='10px Courier New';
      gctx.textAlign='center';
      gctx.fillText(G.playerNick,px,hpY-5);
      gctx.textAlign='left';
    }
    gctx.fillStyle='#222';gctx.fillRect(px-hbw/2,hpY,hbw,7);
    gctx.fillStyle=G.inSafeZone?'#3f6':G.hp/G.maxHp<.3?'#f44':'#4f4';
    gctx.fillRect(px-hbw/2,hpY,hbw*(G.hp/G.maxHp),7);
    gctx.strokeStyle='#fff4';gctx.strokeRect(px-hbw/2,hpY,hbw,7);
    if(ev.meleeOnly){
      if(G.mouseDown&&getSwordCharge()>0.02)drawSwordChargeRing(gctx,px,py,angle,ev);
      if(G.swordSwipes)for(let sw of G.swordSwipes)drawSwordSwipe(gctx,px,py,sw);
    }
    drawRobot(gctx,px,py,G.evoLine,G.evoIdx,ev.size,true,angle,bob,recoil);
    if(G.running&&G.overchargeT>0){
      gctx.strokeStyle='#f80';gctx.lineWidth=2;
      gctx.beginPath();gctx.arc(px,py,ev.size+10,0,Math.PI*2);gctx.stroke();
    }
  }
  resetCtx(gctx);
  gctx.restore();
  if(G.running||onGo)drawMinimap();
}

function drawMinimap(){
  const MW=169,MH=169;
  mctx.clearRect(0,0,MW,MH);
  let viewW=gc.width*0.92*1.5,viewH=gc.height*0.92*1.5;
  let zoom=Math.min(MW/viewW,MH/viewH)*0.9;
  let px=G.px,py=G.py;
  function mx(wx){return MW/2+(wx-px)*zoom;}
  function my(wy){return MH/2+(wy-py)*zoom;}
  mctx.fillStyle='#050a12';mctx.fillRect(0,0,MW,MH);
  if(G.regionsUnlocked){
    mctx.fillStyle=BIOMES[4].bg;
    mctx.fillRect(mx(0),my(0),WORLD_W*zoom,MIDDLE_Y0*zoom);
    mctx.fillStyle=BIOMES[5].bg;
    mctx.fillRect(mx(0),my(MIDDLE_Y0+MIDDLE_H),WORLD_W*zoom,EXT_H*zoom);
  }
  for(let bi=0;bi<3;bi++){
    let b=BIOME_BOUNDS[bi];
    mctx.fillStyle=BIOMES[bi].bg;
    mctx.fillRect(mx(b.x),my(b.y),b.w*zoom,b.h*zoom);
  }
  let ccx=mx(CORE_ZONE.cx),ccy=my(CORE_ZONE.cy);
  if(ccx>-20&&ccx<MW+20&&ccy>-20&&ccy<MH+20){
    mctx.fillStyle=BIOMES[3].bg;
    mctx.beginPath();mctx.arc(ccx,ccy,CORE_ZONE.r*zoom,0,Math.PI*2);mctx.fill();
  }
  for(let z of G.mapZones){
    if(z.type==='safe'){
      mctx.fillStyle='#3f6';
      mctx.fillRect(mx(z.x)-2,my(z.y)-2,4,4);
    }
    if(z.type==='nexusaltar'){mctx.fillStyle='#f0f';mctx.fillRect(mx(z.x)-2,my(z.y)-2,4,4);}
  }
  let visR=Math.hypot(gc.width,gc.height)*0.55;
  for(let e of G.enemies){
    if(Math.hypot(e.x-px,e.y-py)>visR)continue;
    let tier=enemyPowerTier(e);
    let sz=2+tier;
    if(e.miniBoss)sz=4;
    if(e.boss||e.nexus||e.turret)sz=6;
    mctx.fillStyle=e.turret?'#f80':e.boss||e.nexus?'#f00':e.miniBoss?'#fa0':e.biome>=4?'#fd6':'#f44';
    let ex=mx(e.x)-sz*.5,ey=my(e.y)-sz*.5;
    mctx.fillRect(ex,ey,sz,sz);
  }
  for(let f of G.foods){
    if(Math.hypot(f.x-px,f.y-py)<visR){
      mctx.fillStyle='#5f5';
      mctx.fillRect(mx(f.x),my(f.y),2,2);
    }
  }
  if(G.running){
    mctx.fillStyle='#0ff';
    mctx.fillRect(MW/2-2,MH/2-2,4,4);
  }
  let pb=mapPlayBounds();
  mctx.strokeStyle='#8ab';mctx.setLineDash([3,2]);
  mctx.strokeRect(mx(pb.left),my(pb.top),(pb.right-pb.left)*zoom,(pb.bottom-pb.top)*zoom);
  mctx.setLineDash([]);
  mctx.strokeStyle='#456';mctx.strokeRect(0,0,MW,MH);
}

const EVO_LINE_LABELS={pyrox:'🔥 Pyrox',cryobot:'❄️ Cryobot',voltek:'⚡ Voltek',titan:'⚔️ Titan'};
const EVO_LINE_COLORS={pyrox:'#ff4400',cryobot:'#00cfff',voltek:'#ffee00',titan:'#d4af37'};

function showEvoTree(line){
  let ov=document.getElementById('evo-tree-overlay');
  let title=document.getElementById('evo-tree-title');
  let nodes=document.getElementById('evo-tree-nodes');
  if(!ov||!nodes)return;
  title.textContent='Эволюция · '+EVO_LINE_LABELS[line];
  title.style.color=EVO_LINE_COLORS[line];
  nodes.innerHTML='';
  EVOS[line].forEach((ev,i)=>{
    if(i>0){
      let conn=document.createElement('div');
      conn.className='evo-tree-connector';
      nodes.appendChild(conn);
    }
    let nd=document.createElement('div');
    nd.className='evo-tree-node';
    let cv=document.createElement('canvas');
    cv.width=72;cv.height=72;
    let sc=0.5+i*0.14;
    drawRobot(cv.getContext('2d'),36,36,line,i,Math.max(10,ev.size*sc),true,0);
    nd.appendChild(cv);
    let lbl=document.createElement('span');
    lbl.textContent='Ур.'+(i+1)+' — '+ev.name;
    lbl.style.color=EVO_LINE_COLORS[line];
    nd.appendChild(lbl);
    nodes.appendChild(nd);
  });
  ov.style.display='flex';
  AudioFX.uiClick();
}

function bindMenuHover(el){
  if(!el||el._uiBound)return;
  el._uiBound=true;
  el.addEventListener('mouseenter',()=>AudioFX.uiHover());
}

function bindMenuUiSounds(){
  document.querySelectorAll('.robot-card').forEach(card=>bindMenuHover(card));
  document.querySelectorAll('.menu-btn,.easter-btn').forEach(btn=>bindMenuHover(btn));
  document.querySelectorAll('.menu-details summary').forEach(s=>bindMenuHover(s));
  let closeBtn=document.getElementById('evo-tree-close');
  if(closeBtn){
    bindMenuHover(closeBtn);
    closeBtn.onclick=()=>{
      document.getElementById('evo-tree-overlay').style.display='none';
      AudioFX.uiClick();
    };
  }
  let evoOv=document.getElementById('evo-tree-overlay');
  if(evoOv)evoOv.addEventListener('click',e=>{if(e.target===evoOv)evoOv.style.display='none';});
}

function buildSelectScreen(){
  let row=document.getElementById('robots-row');row.innerHTML='';
  ['pyrox','cryobot','voltek','titan'].forEach(t=>{
    let ev=EVOS[t][0],colors=EVO_LINE_COLORS;
    let card=document.createElement('div');card.className='robot-card';
    card.style.borderColor=colors[t];card.style.boxShadow='0 0 18px '+colors[t]+'44';
    let hint=document.createElement('span');hint.className='robot-rmb-hint';hint.title='ПКМ — дерево эволюции';
    card.appendChild(hint);
    let cv=document.createElement('canvas');cv.width=80;cv.height=80;
    drawRobot(cv.getContext('2d'),40,40,t,0,ev.size,true,0);
    card.appendChild(cv);
    let h3=document.createElement('h3');h3.textContent={pyrox:'🔥',cryobot:'❄️',voltek:'⚡',titan:'⚔️'}[t]+' '+ev.name;h3.style.color=colors[t];
    card.appendChild(h3);
    bindMenuHover(card);
    card.onclick=()=>{AudioFX.unlock().then(()=>{AudioFX.uiClick();initGame(t);});};
    card.oncontextmenu=e=>{
      e.preventDefault();
      AudioFX.uiHover();
      showEvoTree(t);
    };
    row.appendChild(card);
  });
  bindMenuUiSounds();
}

// === INPUT ===
gc.addEventListener('mousemove',e=>{G.mx=e.clientX;G.my=e.clientY;});
gc.addEventListener('mousedown',e=>{
  if(!G.running||G.paused)return;
  if(e.button===0)G.mouseDown=true;
  if(e.button===2){e.preventDefault();G.rmbDown=true;}
});
gc.addEventListener('mouseup',e=>{
  if(e.button===0)G.mouseDown=false;
  if(e.button===2)G.rmbDown=false;
});
gc.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'&&G.running){
    if(document.getElementById('evo-overlay').style.display==='flex')return;
    if(document.getElementById('relic-overlay').style.display==='flex')return;
    G.paused=!G.paused;
    AudioFX.setPaused(G.paused);
    document.getElementById('pause-overlay').style.display=G.paused?'flex':'none';
    return;
  }
  if(G.paused){
    if(e.code==='Digit1')spendUpgrade('speed');
    if(e.code==='Digit2')spendUpgrade('damage');
    if(e.code==='Digit3')spendUpgrade('firerate');
    if(e.code==='Digit4')spendUpgrade('shield');
    if(e.code==='Digit5')spendUpgrade('stamina');
    return;
  }
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')G.specialDown=true;
  if(e.code==='Space'&&G.running){e.preventDefault();G.spaceHeld=true;}
  if(e.code==='KeyE'&&G.running)energyNodeBlast();
  if(G.running){
    let km={Digit1:'speed',Digit2:'damage',Digit3:'firerate',Digit4:'shield',Digit5:'stamina'};
    if(km[e.code]){e.preventDefault();spendUpgrade(km[e.code]);}
  }
});
window.addEventListener('keyup',e=>{
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')G.specialDown=false;
  if(e.code==='Space')G.spaceHeld=false;
});
document.getElementById('btn-restart').onclick=()=>{AudioFX.uiClick();returnToSelectScreen();};
document.getElementById('btn-new-game-pause').onclick=()=>{AudioFX.uiClick();returnToSelectScreen();};
bindMenuHover(document.getElementById('btn-new-game-pause'));
bindMenuHover(document.getElementById('btn-restart'));

(function bindUpgradeHudUi(){
  let panel=document.getElementById('upgrade-panel');
  if(!panel)return;
  panel.addEventListener('mouseenter',()=>{G.mouseOverUpgradeHud=true;updateUpgradePanelVisibility();});
  panel.addEventListener('mouseleave',()=>{G.mouseOverUpgradeHud=false;updateUpgradePanelVisibility();});
})();

function setFaviconFromRobot(){
  let c=document.createElement('canvas');
  c.width=64;c.height=64;
  let ctx=c.getContext('2d');
  ctx.fillStyle='#0a0504';
  ctx.fillRect(0,0,64,64);
  ctx.save();
  ctx.beginPath();ctx.rect(1,1,62,62);ctx.clip();
  drawRobot(ctx,32,32,'pyrox',0,22,true,0,1,0);
  ctx.restore();
  let link=document.getElementById('favicon');
  if(link)link.href=c.toDataURL('image/png');
}

let loopLastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const cap=GameSettings.fpsCap|0;
  if(cap>0){
    const minStep=1000/cap;
    if(ts-loopLastTs<minStep*0.9)return;
    loopLastTs=ts;
  }else loopLastTs=ts;
  update();render();
}
function tryUnlockAudio(){
  AudioFX.unlock().then(()=>{if(!G.running)AudioFX.playMenuMusic();});
}
window.addEventListener('pointerdown',tryUnlockAudio,{once:true});
window.addEventListener('keydown',tryUnlockAudio,{once:true});

fillControlsHelp();
loadSavedNick();
initGameSettings();
initEasterEggUi();
setEasterEggMenuVisible(true);
buildSelectScreen();
bindMenuUiSounds();
setFaviconFromRobot();
loop();
</script>
