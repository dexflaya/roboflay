<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ROBOVERSE</title>
<link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff;cursor:crosshair}
canvas{display:block}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#hud-top{position:absolute;top:6px;left:6px;font-size:12px;text-shadow:0 0 8px currentColor;pointer-events:none}
#hud-xp-top{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(480px,72vw);pointer-events:none}
#hud-xp-top .bar-wrap{justify-content:center;gap:10px;width:100%}
#hud-xp-top .bar{flex:1;max-width:400px;width:100%;height:14px}
#hud-xp-top .bar-wrap>span{font-size:12px;font-weight:bold}
#hud-bottom-left{position:absolute;bottom:10px;left:10px;display:flex;align-items:flex-end;gap:14px;pointer-events:none}
#bars{display:flex;flex-direction:column;gap:6px}
#upgrade-panel{display:none;flex-direction:column;gap:7px;padding:12px 14px;background:linear-gradient(165deg,rgba(10,28,52,.8),rgba(5,14,28,.8));backdrop-filter:blur(6px);border:1px solid rgba(0,200,255,.5);border-radius:10px;pointer-events:auto;min-width:228px;opacity:0;transform:translateX(-10px);transition:opacity .25s ease,transform .25s ease,border-color .3s,box-shadow .3s;box-shadow:0 6px 28px rgba(0,0,0,.5),0 0 18px rgba(0,140,255,.12),inset 0 1px 0 rgba(255,255,255,.07)}
#upgrade-panel.upg-instant{transition:none}
#upgrade-panel.upg-visible{opacity:1;transform:translateX(0);border-color:rgba(0,220,255,.65);box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 24px rgba(0,160,255,.18),inset 0 1px 0 rgba(255,255,255,.09)}
#upgrade-panel .upg-title{font-size:11px;color:#9df;letter-spacing:3px;margin-bottom:0;text-align:center;text-shadow:0 0 10px rgba(0,180,255,.5)}
#upgrade-panel .upg-points{font-size:12px;color:#fc8;text-align:center;margin-bottom:2px;font-weight:bold;text-shadow:0 0 8px rgba(255,180,0,.35)}
.upgrade-row{display:flex;align-items:center;gap:8px;font-size:11px;padding:2px 0}
.upgrade-row .upg-label{width:68px;color:#adf;flex-shrink:0;font-weight:bold;letter-spacing:.5px}
.upgrade-segments{display:flex;gap:4px;flex:1}
.upgrade-seg{flex:1;height:13px;min-width:24px;background:rgba(8,14,24,.85);border:1px solid rgba(80,110,150,.45);border-radius:3px;transition:background .2s,box-shadow .2s,border-color .2s,transform .15s}
.upgrade-seg.filled{border-color:transparent;transform:scaleY(1.02)}
.upgrade-btn{width:26px;height:26px;padding:0;border:1px solid rgba(80,200,255,.65);background:linear-gradient(180deg,rgba(0,70,120,.9),rgba(0,35,70,.95));color:#cef;font-family:inherit;font-size:17px;font-weight:bold;line-height:1;border-radius:5px;cursor:pointer;flex-shrink:0;transition:transform .12s,box-shadow .12s,background .12s}
.upgrade-btn:hover:not(:disabled){background:linear-gradient(180deg,rgba(0,100,160,.95),rgba(0,55,100,.98));color:#fff;box-shadow:0 0 14px rgba(0,180,255,.45);transform:scale(1.06)}
.upgrade-btn:disabled{opacity:.22;cursor:default;border-color:#456;color:#567;transform:none;box-shadow:none}
.upgrade-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.upgrade-key{width:16px;font-size:11px;font-weight:bold;color:#9ef;text-align:center;opacity:0;transition:opacity .2s}
#upgrade-panel.has-points .upgrade-key,#upgrade-panel:hover .upgrade-key{opacity:1}
.hud-menu-btn{margin-top:6px;padding:6px 12px;font-family:inherit;font-size:11px;background:rgba(0,40,80,.5);border:1px solid #3af;color:#8ef;border-radius:4px;cursor:pointer;width:100%}
.hud-menu-btn:hover{background:rgba(0,80,140,.65);color:#fff}
#shield-bar{display:none}
#shield-bar .bar{transition:width .35s ease}
.bar-wrap{display:flex;align-items:center;gap:8px;font-size:13px}
.bar{width:200px;height:12px;background:#111;border:1px solid #333;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;transition:width .15s;border-radius:3px}
#hp-fill{background:linear-gradient(90deg,#f00,#f55);box-shadow:0 0 6px #f00}
#xp-fill{background:linear-gradient(90deg,#0f0,#5f5);box-shadow:0 0 6px #0f0}
#en-fill{background:linear-gradient(90deg,#ff0,#ff8);box-shadow:0 0 6px #ff0}
#shield-fill{background:linear-gradient(90deg,#08f,#8cf);box-shadow:0 0 6px #0af;height:100%;border-radius:3px;width:100%}
#minimap{position:absolute;bottom:10px;right:10px;width:169px;height:169px;border:1px solid #444;background:#111;border-radius:4px}
#kills{position:absolute;top:10px;right:10px;font-size:14px;text-align:right;text-shadow:0 0 6px #0ff;line-height:1.5}
#combo{position:absolute;top:48px;right:10px;font-size:16px;color:#ff0;text-shadow:0 0 10px #ff0;opacity:0;transition:opacity .3s}
#quest-hud{position:absolute;top:26px;left:6px;font-size:11px;color:#9ce;max-width:min(300px,42vw);line-height:1.55;text-shadow:0 0 6px rgba(0,120,255,.45);pointer-events:none;padding:6px 8px;background:rgba(4,12,24,.72);border:1px solid rgba(0,140,255,.22);border-radius:6px}
#quest-hud .q-done{color:#6f9}
#quest-hud .q-active{color:#bdf}
#node-fill{background:linear-gradient(90deg,#f0f,#f8f);box-shadow:0 0 6px #f0f;height:100%;border-radius:3px}
@keyframes menuFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes menuGlow{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes scanMove{from{background-position:0 0}to{background-position:0 120px}}
#overlay,#pause-overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:all;overflow:auto;padding:20px 12px;background:radial-gradient(ellipse 80% 50% at 50% 20%,#0c2040 0%,#03060c 55%,#000 100%)}
#overlay::before,#pause-overlay::before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,255,.03) 2px,rgba(0,255,255,.03) 4px);animation:scanMove 8s linear infinite}
#pause-overlay{z-index:30;display:none;pointer-events:none;background:radial-gradient(ellipse at center,#0a1a30ee,#020408f2)}
#pause-overlay .menu-panel{pointer-events:auto}
.menu-panel{position:relative;text-align:center;animation:menuFadeUp .5s ease;background:linear-gradient(165deg,rgba(10,28,52,.96),rgba(4,10,22,.98));border:1px solid rgba(0,190,255,.4);border-radius:18px;padding:26px 28px 22px;max-width:min(900px,96vw);width:100%;box-shadow:0 0 50px rgba(0,140,255,.12),0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.menu-panel::after{content:'';position:absolute;inset:-1px;border-radius:18px;background:linear-gradient(135deg,rgba(0,255,255,.25),transparent 40%,rgba(255,120,0,.15));z-index:-1;opacity:.5;animation:menuGlow 3s ease infinite}
.menu-logo{font-size:38px;letter-spacing:10px;margin:0 0 4px;background:linear-gradient(90deg,#ff6633,#22ccff,#ffee44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.menu-logo-sm{font-size:28px;letter-spacing:12px;margin:0 0 16px;color:#5ef;text-shadow:0 0 24px #0af}
.menu-tagline{margin:0 0 18px;font-size:12px;color:#7ab;letter-spacing:3px;text-transform:uppercase}
.menu-nick-wrap{margin:0 auto 18px;max-width:280px}
.menu-nick{width:100%;padding:10px 14px;font-family:inherit;font-size:13px;color:#def;background:rgba(0,20,40,.8);border:1px solid rgba(0,180,255,.45);border-radius:8px;outline:none;transition:border-color .2s,box-shadow .2s}

.menu-nick::placeholder{color:#5a7a8a}

.robot-card{width:132px;min-width:132px;max-width:132px;position:relative;box-sizing:border-box}

.vol-label{width:72px;flex-shrink:0;color:#8cf}
.vol-row input[type=range]{flex:1;accent-color:#2af;height:5px;cursor:pointer}

.menu-actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px;pointer-events:auto}
.menu-btn{padding:11px 28px;font-family:inherit;font-size:12px;letter-spacing:2px;background:linear-gradient(180deg,#057,#024);border:1px solid #3af;color:#cef;border-radius:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.menu-btn:hover{transform:scale(1.04);box-shadow:0 0 20px rgba(0,170,255,.35);color:#fff}
.menu-hint{font-size:11px;color:#6a8a9a;letter-spacing:1px}
#evo-overlay,#gameover-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:all}
#evo-overlay,#gameover-overlay{display:none}
#evo-screen,#gameover-screen{text-align:center}

#evo-choices{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}

#go-stats{font-size:12px;color:#aaa;margin:16px 0;line-height:2}

#easter-egg-wrap{position:fixed;top:14px;right:14px;z-index:25;pointer-events:auto;display:none;flex-direction:column;align-items:flex-end;gap:8px}
.easter-btn{padding:8px 14px;font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:2px;background:rgba(60,0,80,.75);border:1px solid #f6f;color:#fbf;text-shadow:0 0 10px #f0f;border-radius:6px;cursor:pointer}

</style>

    <div class="bar-wrap"><span style="color:#5f5">XP</span><div class="bar"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div><span style="color:#8f8;font-size:11px">Ур. <span id="lvl-xp">1</span></span></div>

<script>
// === CONSTANTS ===
const WORLD_W=7000;
const MIDDLE_H=3000,EXT_H=800;
const WORLD_H=MIDDLE_H+EXT_H*2;
const MIDDLE_Y0=EXT_H;
const MAP_PAD_X=72,MAP_PAD_Y=88;
const CORE_ZONE={cx:3500,cy:MIDDLE_Y0+1500,r:420};

function mapPlayBounds(){
  if(G.regionsUnlocked){
    return {left:MAP_PAD_X,right:WORLD_W-MAP_PAD_X,top:MAP_PAD_Y,bottom:WORLD_H-MAP_PAD_Y};
  }
  return {left:MAP_PAD_X,right:WORLD_W-MAP_PAD_X,top:MIDDLE_Y0+MAP_PAD_Y,bottom:MIDDLE_Y0+MIDDLE_H-MAP_PAD_Y};
}

function clampMapPos(x,y,r){
  let b=mapPlayBounds();
  return {
    x:Math.max(b.left+r,Math.min(b.right-r,x)),
    y:Math.max(b.top+r,Math.min(b.bottom-r,y))
  };
}

function isInsidePlayBounds(x,y,r){
  let b=mapPlayBounds(),m=r||0;
  return x>=b.left+m&&x<=b.right-m&&y>=b.top+m&&y<=b.bottom-m;
}

function clampSpawnPos(x,y,r){return clampMapPos(x,y,r||0);}

function boundarySteer(wx,wy,r,maxPush){
  let b=mapPlayBounds(),margin=40+(r||10),fx=0,fy=0,push=maxPush||1;
  if(wx<b.left+margin)fx+=((b.left+margin)-wx)/margin*push;
  if(wx>b.right-margin)fx-=((wx)-(b.right-margin))/margin*push;
  if(wy<b.top+margin)fy+=((b.top+margin)-wy)/margin*push;
  if(wy<b.bottom-margin)fy-=((wy)-(b.bottom-margin))/margin*push;
  return {fx,fy};
}

function repelFromSafeZones(x,y,r){
  // Enemies are not allowed to enter safe zones.
  for(let z of G.mapZones){
    if(z.type!=='safe'||!z.r)continue;
    let dx=x-z.x,dy=y-z.y;
    let dist=Math.hypot(dx,dy)||0.0001;
    let min=z.r+r+8;
    if(dist<min){
      let nx=dx/dist,ny=dy/dist;
      x=z.x+nx*min;
      y=z.y+ny*min;
    }
  }
  return {x,y};
}

function pickLocalPatrol(ex,ey,r){
  let pt=clampSpawnPos(ex+(Math.random()-.5)*140,ey+(Math.random()-.5)*140,r||10);
  return {x:pt.x,y:pt.y};
}

function moveEnemyToward(e,tx,ty,espd,r){
  let dx=tx-e.x,dy=ty-e.y,dist=Math.hypot(dx,dy)||1;
  let mx=dx/dist*espd,my=dy/dist*espd;
  let nx=e.x+mx,ny=e.y+my;
  let clamped=clampMapPos(nx,ny,r);
  if(Math.hypot(clamped.x-nx,clamped.y-ny)>0.4){
    let st=boundarySteer(e.x,e.y,r,0.85);
    clamped=clampMapPos(e.x+mx+st.fx*espd*0.55,e.y+my+st.fy*espd*0.55,r);
  }
  let rep=repelFromSafeZones(clamped.x,clamped.y,r);
  e.x=rep.x;e.y=rep.y;
  e.angle=Math.atan2(ty-e.y,tx-e.x);
}

function getSquadLeader(e){
  if(!e.squadId)return null;
  return G.enemies.find(x=>x.isSquadLeader&&x.squadId===e.squadId)||null;
}

function moveSquadMinion(e,leader,espd,d){
  let r=e.size||8;
  let slot=e.squadSlot||0;
  let a=slot/SQUAD_DRONE_COUNT*Math.PI*2+G.gameTime*.018;
  let orbitR=78+(leader.size||16);
  let tx=leader.x+Math.cos(a)*orbitR;
  let ty=leader.y+Math.sin(a)*orbitR;
  let fd=Math.hypot(tx-e.x,ty-e.y);
  if(leader.state==='chase'||d<400)e.state='chase';
  if(fd>22)moveEnemyToward(e,tx,ty,espd*1.15,r);
  else if(d>50&&leader.state==='chase')moveEnemyToward(e,G.px,G.py,espd*0.4,r);
  else moveEnemyToward(e,tx,ty,espd*0.55,r);
}

function moveEnemyAI(e,espd,d){
  let r=e.size||10;
  let leader=getSquadLeader(e);
  if(leader&&!e.isSquadLeader){
    moveSquadMinion(e,leader,espd,d);
    return;
  }
  if(e.state==='chase'&&d>1){
    moveEnemyToward(e,G.px,G.py,espd,r);
    return;
  }
  let pb=mapPlayBounds();
  let ptBad=!e.patrolTarget||e.patrolTarget.x<pb.left+r+8||e.patrolTarget.x>pb.right-r-8||
    e.patrolTarget.y<pb.top+r+8||e.patrolTarget.y>pb.bottom-r-8;
  let pd=e.patrolTarget?Math.hypot(e.patrolTarget.x-e.x,e.patrolTarget.y-e.y):9999;
  if(!e.patrolTarget||pd<16||ptBad)e.patrolTarget=pickLocalPatrol(e.x,e.y,r);
  if(d<520&&!G.inSafeZone){
    moveEnemyToward(e,G.px,G.py,espd*0.45,r);
  }else if(pd>1){
    moveEnemyToward(e,e.patrolTarget.x,e.patrolTarget.y,espd*0.42,r);
  }
}

const AudioFX={
  ctx:null,sfx:null,music:null,master:null,musicNodes:[],musicMode:null,
  last:{shoot:0,enemyShoot:0,hit:0,step:0,uiHover:0},
  volGame:1,volMusic:1,volSfx:1,_paused:false,
  VOL_KEY:'roboverse_vol',
  BASE_MUSIC:0.24,BASE_SFX:0.55,
  init(){
    if(this.ctx)return;
    let AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    this.ctx=new AC();
    this.master=this.ctx.createGain();
    this.sfx=this.ctx.createGain();
    this.music=this.ctx.createGain();
    this.sfx.connect(this.master);
    this.music.connect(this.master);
    this.master.connect(this.ctx.destination);
    this.loadVol();
    this.applyVolumes();
  },
  loadVol(){
    try{
      let v=JSON.parse(localStorage.getItem(this.VOL_KEY)||'{}');
      if(typeof v.game==='number')this.volGame=Math.max(0,Math.min(1,v.game));
      if(typeof v.music==='number')this.volMusic=Math.max(0,Math.min(1,v.music));
      if(typeof v.sfx==='number')this.volSfx=Math.max(0,Math.min(1,v.sfx));
    }catch(e){}
  },
  saveVol(){
    try{
      localStorage.setItem(this.VOL_KEY,JSON.stringify({game:this.volGame,music:this.volMusic,sfx:this.volSfx}));
    }catch(e){}
  },
  applyVolumes(){
    if(!this.ctx||!this.master)return;
    let t=this.ctx.currentTime;
    let duck=this._paused?0.25:1;
    let duckSfx=this._paused?0.36:1;
    this.master.gain.setTargetAtTime(this.volGame,t,0.08);
    this.music.gain.setTargetAtTime(this.BASE_MUSIC*this.volMusic*duck,t,0.08);
    this.sfx.gain.setTargetAtTime(this.BASE_SFX*this.volSfx*duckSfx,t,0.08);
  },
  setVolume(kind,v01){
    v01=Math.max(0,Math.min(1,v01));
    if(kind==='game')this.volGame=v01;
    else if(kind==='music')this.volMusic=v01;
    else if(kind==='sfx')this.volSfx=v01;
    this.saveVol();
    this.applyVolumes();
    syncVolumeSlidersUI();
  },
  async unlock(){
    this.init();
    if(!this.ctx)return;
    if(this.ctx.state==='suspended')await this.ctx.resume();
  },
  setPaused(p){
    this._paused=!!p;
    this.applyVolumes();
  },
  _out(g,bus){g.connect(bus==='music'?this.music:this.sfx);},
  _t(t,f,d,type,vol,slide,bus){
    if(!this.ctx)return;
    let o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);this._out(g,bus||'sfx');
    o.start(t);o.stop(t+d+0.06);
  },
  _n(t,d,vol,f,q,bus){
    if(!this.ctx)return;
    let sr=this.ctx.sampleRate,n=Math.floor(sr*d);
    let buf=this.ctx.createBuffer(1,n,sr),d0=buf.getChannelData(0);
    for(let i=0;i<n;i++)d0[i]=Math.random()*2-1;
    let src=this.ctx.createBufferSource(),flt=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    src.buffer=buf;flt.type='bandpass';flt.frequency.value=f;flt.Q.value=q||0.9;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+d);
    src.connect(flt);flt.connect(g);this._out(g,bus||'sfx');
    src.start(t);src.stop(t+d);
  },
  stopMusic(){
    if(this._menuTimer){clearTimeout(this._menuTimer);this._menuTimer=null;}
    this.musicNodes.forEach(n=>{try{n.stop();}catch(e){}try{n.disconnect();}catch(e){}});
    this.musicNodes=[];this.musicMode=null;
  },
  _pad(freq,type,vol,lfoSpd){
    let c=this.ctx,t=c.currentTime;
    let o=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
    o.type=type;o.frequency.value=freq;
    lfo.frequency.value=lfoSpd;lg.gain.value=vol*0.65;
    g.gain.value=vol;
    lfo.connect(lg);lg.connect(g.gain);
    o.connect(g);g.connect(this.music);
    o.start();lfo.start();
    this.musicNodes.push(o,lfo,g,lg);
  },
  playMenuMusic(){
    if(!this.ctx||this.musicMode==='menu')return;
    this.stopMusic();this.musicMode='menu';
    this._menuStep=0;
    this._pad(41.2,'sine',0.085,0.05);
    this._pad(61.74,'triangle',0.065,0.062);
    this._pad(82.41,'sine',0.055,0.045);
    this._pad(110,'sine',0.04,0.038);
    this._pad(164.81,'triangle',0.032,0.03);
    this._menuMelody();
  },
  _menuMelody(){
    if(this.musicMode!=='menu'||!this.ctx)return;
    let t=this.ctx.currentTime;
    let prog=[0,3,5,7,10,12,10,7,5,3,0,5];
    let roots=[55,65.41,73.42,82.5];
    let n=prog[this._menuStep%prog.length];
    let root=roots[Math.floor(this._menuStep/prog.length)%roots.length];
    let f=root*Math.pow(2,n/12);
    this._t(t,f,0.42,'triangle',0.065,0.88,'music');
    this._t(t+0.08,f*2,0.28,'sine',0.028,0.75,'music');
    if(this._menuStep%4===0)this._n(t,0.06,0.04,280+this._menuStep*8,0.7,'music');
    this._menuStep++;
    this._menuTimer=setTimeout(()=>this._menuMelody(),460);
  },
  playGameMusic(){
    if(!this.ctx||this.musicMode==='game')return;
    this.stopMusic();this.musicMode='game';
    this._pad(73.42,'sine',0.05,0.08);
    this._pad(98,'triangle',0.04,0.1);
    this._pad(146.83,'sine',0.03,0.06);
  },
  playerShoot(line,special,weapon){
    if(!this.ctx)return;
    let now=performance.now();
    if(now-this.last.shoot<45)return;
    this.last.shoot=now;
    let t=this.ctx.currentTime;
    if(line==='pyrox'){
      this._n(t,0.07,special?0.22:0.16,weapon==='shotgun'?280:520,1.1);

  enemyShoot(e,tier){
    if(!this.ctx)return;
    let now=performance.now();
    if(now-this.last.enemyShoot<70)return;
    this.last.enemyShoot=now;

const lastVolSliderPct={};

function onVolumeSliderInput(e){
  let k=e.target.dataset.vol;
  let pct=parseInt(e.target.value,10);
  if(isNaN(pct))return;
  let prev=lastVolSliderPct[k];
  if(prev!==undefined&&prev!==pct)AudioFX.volTick(pct>prev);
  lastVolSliderPct[k]=pct;
  AudioFX.setVolume(k,pct/100);
  let lab=e.target.closest('.vol-row')?.querySelector('.vol-pct');
  if(lab)lab.textContent=pct+'%';
}
function initVolumeSettings(){
  AudioFX.loadVol();
  syncVolumeSlidersUI();
  document.querySelectorAll('.vol-slider').forEach(inp=>{
    let k=inp.dataset.vol,pct=parseInt(inp.value,10);
    if(k&&!isNaN(pct))lastVolSliderPct[k]=pct;
    inp.addEventListener('input',onVolumeSliderInput);
    inp.addEventListener('change',onVolumeSliderInput);
  });
}

function loadSettings(){
  try{return Object.assign({},DEFAULT_SETTINGS,JSON.parse(localStorage.getItem(SETTINGS_KEY)));}

}

function saveSettings(s){
  try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));}catch(e){}

}

const EasterEgg={
  audio:null,playing:false,vol:0.7,VOL_KEY:'roboverse_easter_vol',
  init(){
    if(this.audio)return;
    this.audio=new Audio('vatoy.wav');
    this.audio.loop=true;
    this.loadVol();
    this.audio.volume=this.vol;
  },
  loadVol(){
    try{
      let v=parseFloat(localStorage.getItem(this.VOL_KEY));
      if(!isNaN(v))this.vol=Math.max(0,Math.min(1,v));
    }catch(e){}
  },
  saveVol(){try{localStorage.setItem(this.VOL_KEY,String(this.vol));}catch(e){}},
  updateUI(){
    let ctr=document.getElementById('easter-egg-controls');
    let btn=document.getElementById('btn-easter');
    let pauseBtn=document.getElementById('btn-easter-pause');
    if(!ctr||!btn)return;
    if(this.playing){
      ctr.hidden=false;
      btn.textContent='■ СТОП';
      if(pauseBtn)pauseBtn.textContent=this.audio&&this.audio.paused?'▶ Продолжить':'⏸ Пауза';
    }else{
      ctr.hidden=true;
      btn.textContent='ПАСХАЛКО';
      if(pauseBtn)pauseBtn.textContent='⏸ Пауза';
    }
  },
  async play(){
    this.init();
    AudioFX.stopMusic();
    try{
      await this.audio.play();
      this.playing=true;
      this.updateUI();
    }catch(err){console.warn('EasterEgg play',err);}
  },
  stop(){
    if(!this.audio){this.playing=false;this.updateUI();return;}
    this.audio.pause();
    this.audio.currentTime=0;
    this.playing=false;
    this.updateUI();
    if(!G.running)AudioFX.playMenuMusic();
  },
  toggle(){
    if(this.playing)this.stop();
    else this.play();
  },
  togglePause(){
    if(!this.audio||!this.playing)return;
    if(this.audio.paused)this.audio.play();
    else this.audio.pause();
    this.updateUI();
  },
  setVol(v01){
    this.vol=Math.max(0,Math.min(1,v01));
    if(this.audio)this.audio.volume=this.vol;
    this.saveVol();
    syncEasterVolUI();
  }
};

function getPlayerShieldMax(){
  let lv=G.upgrades.shield;
  if(lv<=0)return 0;
  return Math.max(6,Math.floor(G.maxHp*0.5*lv/UPGRADE_MAX));
}

function syncPlayerShield(fill){
  let max=getPlayerShieldMax();
  if(max<=0){G.shield=0;return;}
  if(fill)G.shield=max;
  else G.shield=Math.min(max,Math.max(0,G.shield));
}

  return (1+G.upgrades.stamina*0.1)*(G.relicBonus.enRegenMult||1);
}

  G.maxEnergy=getPlayerMaxEnergy();

}

function updateUpgradePanelVisibility(){
  let panel=document.getElementById('upgrade-panel');
  if(!panel)return;
  if(!G.running){
    panel.classList.remove('upg-visible','upg-instant');
    panel.style.display='none';
    return;
  }
  panel.style.display='flex';
  let fromHover=G.mouseOverUpgradeHud;
  let fromLevel=G.gameTime<G.upgradePanelHideAt;
  let visible=fromHover||fromLevel;
  panel.classList.toggle('upg-visible',visible);
  panel.classList.toggle('upg-instant',fromHover);
}

function applyDamageToPlayer(amount,silent){
  if(amount<=0||G.inSafeZone)return 0;
  G.lastDamageTime=G.gameTime;
  let remaining=amount;
  let shMax=getPlayerShieldMax();
  if(shMax>0&&G.shield>0){
    let absorbed=Math.min(G.shield,remaining);
    G.shield-=absorbed;
    remaining-=absorbed;
    if(absorbed>0&&!silent)AudioFX.hitShield();
  }
  if(remaining>0){
    G.hp-=remaining;
    if(!silent)AudioFX.hitPlayer(remaining);
    if(G.hp<=0)gameOver('Вы уничтожены!');
    return remaining;
  }
  return 0;
}

const BIOME_ENV_TICK=26;
function applyBiomeEnvDamage(amount){
  if(amount<=0||G.inSafeZone)return 0;
  let dealt=applyDamageToPlayer(amount,true);
  if(dealt>0){
    if(!G._biomeDmgSoundT||performance.now()-G._biomeDmgSoundT>420){
      G._biomeDmgSoundT=performance.now();
      AudioFX.hazard();
    }
  }
  return dealt;
}

function updateShieldRegen(){
  if(!G.running||G.inSafeZone)return;
  let max=getPlayerShieldMax();
  if(G.shield>=max)return;
  if(G.gameTime-(G.lastDamageTime||0)<SHIELD_REGEN_DELAY)return;
  G.shield=Math.min(max,G.shield+max*0.007);
}

function getPlayerSpeedMult(){return (1+G.upgrades.speed*0.09)*(G.relicBonus.speedMult||1);}
function getPlayerAtkMult(){return (1+G.upgrades.damage*0.11)*(G.relicBonus.dmgMult||1);}
function getPlayerFireMult(){return Math.max(0.52,1-G.upgrades.firerate*0.09);}
function getFireCooldown(ev,special){
  let base=special?ev.fireRate*1.35:ev.fireRate;
  return Math.max(6,Math.floor(base*getPlayerFireMult()/G.relicBonus.shootMult));
}

function spendUpgrade(key){
  if(!G.running||G.upgradePoints<=0)return;
  if(G.upgrades[key]>=UPGRADE_MAX)return;
  G.upgrades[key]++;
  G.upgradePoints--;
  if(key==='shield')syncPlayerShield(true);
  if(key==='stamina')syncPlayerEnergy(true);
  renderUpgradeHud();
  updateHUD();
  AudioFX.upgrade();
  showMsg(UPGRADE_DEFS[key].label+' ур. '+G.upgrades[key]);
}

function renderUpgradeHud(){
  let panel=document.getElementById('upgrade-panel');
  let rows=document.getElementById('upgrade-rows');
  let pts=document.getElementById('upg-points');
  if(!panel||!rows)return;
  if(!G.running){
    panel.style.display='none';
    return;
  }
  panel.classList.toggle('has-points',G.upgradePoints>0);
  pts.textContent='Очков: '+G.upgradePoints;
  updateUpgradePanelVisibility();
  rows.innerHTML='';
  for(let ki=0;ki<UPGRADE_KEYS.length;ki++){
    let key=UPGRADE_KEYS[ki];
    let def=UPGRADE_DEFS[key],lv=G.upgrades[key];
    let row=document.createElement('div');
    row.className='upgrade-row';
    let lbl=document.createElement('span');
    lbl.className='upg-label';
    lbl.style.color=def.color;
    lbl.textContent=def.label;
    row.appendChild(lbl);
    let segs=document.createElement('div');
    segs.className='upgrade-segments';
    for(let i=0;i<UPGRADE_MAX;i++){
      let seg=document.createElement('div');
      seg.className='upgrade-seg'+(i<lv?' filled':'');
      if(i<lv){
        seg.style.background=def.color;
        seg.style.borderColor=def.color;
        seg.style.color=def.color;
        seg.style.boxShadow='0 0 10px '+def.color;
      }
      segs.appendChild(seg);
    }
    row.appendChild(segs);
    let actions=document.createElement('div');
    actions.className='upgrade-actions';
    let keyEl=document.createElement('span');
    keyEl.className='upgrade-key';
    keyEl.textContent=String(ki+1);
    actions.appendChild(keyEl);
    let btn=document.createElement('button');
    btn.type='button';
    btn.className='upgrade-btn';
    btn.textContent='+';
    btn.title=def.tip+' ['+(ki+1)+'] ('+lv+'/'+UPGRADE_MAX+')';
    btn.disabled=G.upgradePoints<=0||lv>=UPGRADE_MAX;
    btn.onclick=()=>spendUpgrade(key);
    actions.appendChild(btn);
    row.appendChild(actions);
    rows.appendChild(row);
  }
}

function returnToSelectScreen(){
  G.running=false;G.paused=false;
  EasterEgg.stop();
  AudioFX.playMenuMusic();
  document.getElementById('pause-overlay').style.display='none';
  document.getElementById('gameover-overlay').style.display='none';

function isInCore(wx,wy){
  let dx=wx-CORE_ZONE.cx,dy=wy-CORE_ZONE.cy;
  return dx*dx+dy*dy<CORE_ZONE.r*CORE_ZONE.r;
}

function mouseCanvasPos(){
  let r=gc.getBoundingClientRect();
  return {x:G.mx-r.left,y:G.my-r.top};
}

function mouseWorldPos(){
  let m=mouseCanvasPos();
  return {x:m.x+G.camX,y:m.y+G.camY};
}

function aimFromPlayer(){
  let w=mouseWorldPos();
  let dx=w.x-G.px,dy=w.y-G.py;
  let dist=Math.hypot(dx,dy);
  return {dx,dy,dist,angle:Math.atan2(dy,dx||0)};
}

// Внутри 20% экрана от центра — медленнее; дальше — полная скорость
function screenMoveSpeedMult(){
  let cx=gc.width/2,cy=gc.height/2,m=mouseCanvasPos();
  let dist=Math.hypot(m.x-cx,m.y-cy);
  let innerR=Math.min(gc.width,gc.height)*0.2;
  if(dist>=innerR)return 1;
  let t=dist/innerR;
  return 0.58+t*0.42;
}

function randomSpawnInBiome(bi){
  let bb=BIOME_BOUNDS[bi],pb=mapPlayBounds(),pad=100,corePad=CORE_ZONE.r+100;
  let x0=Math.max(pb.left+pad,bb.x+pad);
  let x1=Math.min(pb.right-pad,bb.x+bb.w-pad);
  let y0=pb.top+pad,y1=pb.bottom-pad;
  for(let t=0;t<90;t++){
    let x=x0+Math.random()*(x1-x0);
    let y=y0+Math.random()*(y1-y0);
    if(isInCore(x,y))continue;
    if(Math.hypot(x-CORE_ZONE.cx,y-CORE_ZONE.cy)<corePad)continue;
    if(overlapsSafeZone(x,y,18))continue;
    return {x,y};
  }
  let x=bi===0?x0+(x1-x0)*.3:bi===2?x0+(x1-x0)*.7:x0+(x1-x0)*.2;
  return {x,y:(y0+y1)*(.35+Math.random()*.3)};
}

function getBiomeAt(wx,wy){
  if(G.regionsUnlocked){
    if(wy<MIDDLE_Y0)return 4;
    if(wy>=MIDDLE_Y0+MIDDLE_H)return 5;
  }
  if(isInCore(wx,wy))return 3;
  for(let i=0;i<BIOME_BOUNDS.length;i++){
    let b=BIOME_BOUNDS[i];
    if(wx>=b.x&&wx<b.x+b.w&&wy>=b.y&&wy<b.y+b.h)return i;
  }
  return 0;
}

function randomSpawnInExtBiome(bi){
  let b=bi===4?EXT_DESERT_BOUNDS:EXT_WATER_BOUNDS;
  let pad=110;
  for(let t=0;t<90;t++){
    let x=b.x+pad+Math.random()*(b.w-pad*2);
    let y=b.y+pad+Math.random()*(b.h-pad*2);
    if(overlapsSafeZone(x,y,24))continue;
    if(overlapsSafeZone(x,y,18))continue;
    return {x,y};
  }
  return {x:b.x+b.w/2,y:b.y+b.h/2};
}

function spawnRandomExtSafeZone(bi){
  let b=bi===4?EXT_DESERT_BOUNDS:EXT_WATER_BOUNDS,rad=90+Math.random()*16;
  for(let t=0;t<90;t++){
    let x=b.x+140+Math.random()*(b.w-280);
    let y=b.y+80+Math.random()*(b.h-160);
    if(overlapsSafeZone(x,y,rad))continue;
    G.mapZones.push({type:'safe',biome:bi,x,y,r:rad});
    return;
  }
}

function buildExtensionWorld(){
  let b=EXT_DESERT_BOUNDS;
  for(let i=0;i<14;i++){
    let x=b.x+80+Math.random()*(b.w-160);
    let y=b.y+60+Math.random()*(b.h-120);
    if(overlapsSafeZone(x,y,40))continue;
    G.mapZones.push({type:'pyramid',x,y,w:50+Math.random()*30,h:45+Math.random()*25,dmg:26,t:Math.random()*10});
  }
  b=EXT_WATER_BOUNDS;
  for(let i=0;i<16;i++){
    let x=b.x+70+Math.random()*(b.w-140);
    let y=b.y+50+Math.random()*(b.h-100);
    if(overlapsSafeZone(x,y,32))continue;
    G.mapZones.push({type:'coral',x,y,r:22+Math.random()*16,dmg:28,t:Math.random()*10});

  spawnRandomExtSafeZone(4);

  addSpeedPadsForBiome(4);
  addSpeedPadsForBiome(5);

function unlockOuterRegions(){
  if(G.regionsUnlocked)return;
  G.regionsUnlocked=true;
  buildExtensionWorld();
  for(let i=0;i<16;i++)spawnEnemyInExtension();
  showMsg('🌌 Открыты ПУСТЫНЯ и ОКЕАН! Новые враги и опасности.');
  G.shakeT=35;
  AudioFX.evolution();
}

// === MAP ZONES ===
function tooCloseToCore(x,y,r){
  let dx=x-CORE_ZONE.cx,dy=y-CORE_ZONE.cy;
  return Math.hypot(dx,dy)<CORE_ZONE.r+r+140;
}

function spawnRandomSafeZones(){
  for(let bi=0;bi<3;bi++){
    let b=BIOME_BOUNDS[bi],rad=92+Math.random()*18;
    for(let t=0;t<90;t++){
      let x=b.x+140+Math.random()*(b.w-280);
      let y=MIDDLE_Y0+160+Math.random()*(MIDDLE_H-320);
      if(getBiomeAt(x,y)!==bi)continue;
      if(tooCloseToCore(x,y,rad))continue;
      if(overlapsSafeZone(x,y,rad))continue;
      G.mapZones.push({type:'safe',biome:bi,x,y,r:rad});
      break;
    }
  }
}

function speedPadAABB(z){
  if(z.shape==='double'&&z.parts&&z.parts.length){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(let p of z.parts){
      x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);
      x1=Math.max(x1,p.x+p.w);y1=Math.max(y1,p.y+p.h);
    }
    return {x:x0,y:y0,w:x1-x0,h:y1-y0};
  }
  return {x:z.x,y:z.y,w:z.w,h:z.h};
}

function pointInSpeedPad(z,wx,wy){
  let b=speedPadAABB(z);
  return wx>=b.x&&wx<=b.x+b.w&&wy>=b.y&&wy<=b.y+b.h;
}

function spawnSpeedPadInArea(x0,y0,areaW,areaH,biomeIdx){
  for(let t=0;t<30;t++){
    if(Math.random()<0.5){
      let s=178+Math.random()*48;
      let x=x0+70+Math.random()*(areaW-s-140);
      let y=y0+70+Math.random()*(areaH-s-140);
      if(overlapsSafeZone(x+s/2,y+s/2,s/2+20))continue;
      G.mapZones.push({type:'speedpad',shape:'single',biome:biomeIdx,x,y,w:s,h:s});
      return;
    }
    let w1=135+Math.random()*45,h1=100+Math.random()*38;
    let w2=w1,h2=h1;
    let horiz=Math.random()<0.5;
    let x=x0+70+Math.random()*(areaW-w1-w2-140);
    let y=y0+70+Math.random()*(areaH-h1-h2-140);
    let parts;
    if(horiz)parts=[{x,y,w:w1,h:h1},{x:x+w1,y,w:w2,h:h2}];
    else parts=[{x,y,w:w1,h:h1},{x,y:y+h1,w:w2,h:h2}];
    let cx=parts[0].x+(horiz?w1+w2:w1)/2,cy=parts[0].y+(horiz?h1:(h1+h2))/2;
    if(overlapsSafeZone(cx,cy,Math.max(w1,w2)/2+20))continue;
    G.mapZones.push({type:'speedpad',shape:'double',biome:biomeIdx,parts});
    return;
  }
}

function addSpeedPadsForBiome(bi){
  let b=bi===4?EXT_DESERT_BOUNDS:bi===5?EXT_WATER_BOUNDS:BIOME_BOUNDS[bi];
  for(let i=0;i<4;i++)spawnSpeedPadInArea(b.x,b.y,b.w,b.h,bi);
}

function buildMapZones(){
  G.mapZones=[];G.hazards=[];
  spawnRandomSafeZones();
  for(let i=0;i<2;i++){
    let b=BIOME_BOUNDS[0];
    G.mapZones.push({type:'geyser',x:b.x+80+Math.random()*(b.w-160),y:MIDDLE_Y0+150+Math.random()*(MIDDLE_H-300),r:40,t:Math.random()*100});
  }
  addSpeedPadsForBiome(1);
  for(let i=0;i<4;i++){
    let b=BIOME_BOUNDS[2];
    G.mapZones.push({type:'turbine',x:b.x+70+Math.random()*(b.w-140),y:MIDDLE_Y0+140+Math.random()*(MIDDLE_H-280),r:45,angle:0});
  }
  G.mapZones.push({type:'nexusaltar',x:CORE_ZONE.cx,y:CORE_ZONE.cy,r:60});
  buildHazards();
}

function buildHazards(){
  const sub=['lava','ice','storm'];
  function addInBiome(bi,n){
    let b=BIOME_BOUNDS[bi],subtype=sub[bi];
    for(let i=0;i<n;i++){
      for(let t=0;t<40;t++){
        let x=b.x+120+Math.random()*(b.w-240);
        let y=MIDDLE_Y0+140+Math.random()*(MIDDLE_H-280);
        if(isInCore(x,y))continue;
        if(Math.hypot(x-CORE_ZONE.cx,y-CORE_ZONE.cy)<CORE_ZONE.r+70)continue;
        if(overlapsSafeZone(x,y,22))continue;
        G.hazards.push({subtype,x,y,r:22,dmg:14,biome:bi});
        break;
      }
    }
  }
  addInBiome(0,3);
  addInBiome(1,3);
  addInBiome(2,3);
  for(let i=0;i<2;i++){
    let a=Math.random()*Math.PI*2,d=CORE_ZONE.r+100+Math.random()*160;
    let x=CORE_ZONE.cx+Math.cos(a)*d,y=CORE_ZONE.cy+Math.sin(a)*d;
    if(overlapsSafeZone(x,y,22))continue;
    G.hazards.push({subtype:'void',x,y,r:22,dmg:18,biome:3});
  }
}

function hazardAt(wx,wy){
  for(let h of G.hazards){
    let dx=wx-h.x,dy=wy-h.y;
    if(dx*dx+dy*dy<(h.r+8)*(h.r+8))return h;
  }
  return null;
}

function zoneAt(wx,wy){
  for(let i=G.mapZones.length-1;i>=0;i--){
    let z=G.mapZones[i];
    if((z.type==='speedpad'||z.type==='iceslide')&&pointInSpeedPad(z,wx,wy))return z;
    if(z.r){
      let dx=wx-z.x,dy=wy-z.y;
      if(dx*dx+dy*dy<z.r*z.r)return z;
    }
  }
  return null;
}

function overlapsSafeZone(x,y,hazardR){
  for(let z of G.mapZones){
    if(z.type!=='safe'||!z.r)continue;
    let dx=x-z.x,dy=y-z.y,min=z.r+hazardR+18;
    if(dx*dx+dy*dy<min*min)return true;
  }
  return false;
}

function enemyPowerTier(e){
  if(e.boss||e.nexus||e.turret)return 4;
  if(e.miniBoss)return 3;
  if(e.size>=20)return 2;
  if(e.size>=16||e.shooter)return 1;
  return 0;
}

function getKillXp(e){
  let base=e.xp||10;
  let t=enemyPowerTier(e);
  let mult=1.9+t*0.65;
  if(e.boss||e.nexus)mult=3.4;
  else if(e.turret)mult=3.6;
  else if(e.miniBoss)mult=2.75;
  if(e.biome===4||e.biome===5)mult*=1.7;
  return Math.floor(base*mult);
}

function playerDmgScale(e){
  let t=enemyPowerTier(e);
  if(e.biome===4||e.biome===5)return 0.88+t*0.1;
  if(e.boss||e.nexus)return 2.15;
  if(e.turret)return 1.45;
  if(e.miniBoss)return 1.95;
  return 1.45+t*0.22;
}

function touchDist(e,ev){
  return Math.hypot(e.x-G.px,e.y-G.py);
}

function isTouchingEnemy(e,ev){
  return touchDist(e,ev)<ev.size+e.size+14;
}

function isRammingEnemy(e,ev){
  return touchDist(e,ev)<ev.size+e.size+22;
}

function separateEnemies(){
  let list=G.enemies;
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      let a=list[i],b=list[j];
      if(a.turret||b.turret)continue;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.001;
      let minD=(a.size||10)+(b.size||10)+10;
      if(d>=minD)continue;
      let push=(minD-d)*0.55,nx=dx/d,ny=dy/d;
      a.x-=nx*push;a.y-=ny*push;
      b.x+=nx*push;b.y+=ny*push;
      let ca=clampMapPos(a.x,a.y,a.size||10),cb=clampMapPos(b.x,b.y,b.size||10);
      a.x=ca.x;a.y=ca.y;b.x=cb.x;b.y=cb.y;
    }
  }
}

function resolvePlayerEnemyContact(e,ev){
  if(G.inSafeZone)return;
  let now=G.gameTime;
  if(isTouchingEnemy(e,ev)&&now-(e.lastHitPlayer||0)>=10){
    e.lastHitPlayer=now;
    let dmg=Math.max(5,e.atk*0.24*playerDmgScale(e));
    if(e.boss||e.nexus||e.turret)dmg*=1.12;
    applyDamageToPlayer(dmg);
    spawnFloat(G.px,G.py-ev.size-6,'-'+Math.ceil(dmg),'#f88',false);
    G.shakeT=Math.max(G.shakeT||0,6);
  }
  if(!isRammingEnemy(e,ev))return;
  if((e.spawnGrace||0)>45)return;
  if(now-(e.lastBumpByPlayer||0)>=10){
    e.lastBumpByPlayer=now;
    let bump=Math.max(2,ev.atk*0.22);
    if(ev.ramMult&&ev.ramMult>1)bump=Math.max(2,ev.atk*0.22*ev.ramMult);
    dealDamageToEnemy(e,bump,false);
    e.hitFlash=8;
  }
}

function resetCtx(ctx){
  ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.globalAlpha=1;
  ctx.setLineDash([]);
}

// === DRAW ===
function drawRobotSword(ctx,len,c,side){
  let s=side||1;
  ctx.save();
  ctx.rotate(s*0.35);
  ctx.fillStyle=c+'cc';ctx.strokeStyle='#fff9';ctx.lineWidth=1.5;
  ctx.fillRect(len*.15,-2,len*.85,4);
  ctx.beginPath();ctx.moveTo(len*1.05,-5);ctx.lineTo(len*1.35,0);ctx.lineTo(len*1.05,5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}

function drawRobot(ctx,x,y,evoLine,evoIdx,size,glow,angle,scale,recoil){
  if(!evoLine||!EVOS[evoLine]||EVOS[evoLine][evoIdx]==null)return;
  let ev=EVOS[evoLine][evoIdx],c=ev.color,idx=evoIdx|0;
  let sc=(scale||1)*(1-(recoil||0)*.08);
  let pulse=1+Math.sin(G.gameTime*.12+idx)*.04;
  ctx.save();ctx.translate(x,y);
  if(angle!=null&&!isNaN(angle))ctx.rotate(angle);
  ctx.scale(sc*pulse,sc*pulse);
  if(glow){ctx.shadowColor=c;ctx.shadowBlur=idx>=2?14:9;}

  if(evoLine==='pyrox'){
    ctx.fillStyle='#1a0804';ctx.strokeStyle=c;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,size*.95,size*.72,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=c+'55';
    for(let i=0;i<6;i++){let a=i*Math.PI/3;ctx.beginPath();ctx.arc(Math.cos(a)*size*.55,Math.sin(a)*size*.42,size*.14,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#ffaa44';ctx.beginPath();ctx.arc(size*.2-(recoil||0)*10,0,size*.22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c;ctx.fillRect(size*.35,-size*.12,size*.95,size*.24);
    if(idx>=1){ctx.strokeStyle='#ff8800';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-size*.4,-size*.5);ctx.lineTo(-size*1.1,-size*.95);ctx.lineTo(-size*.65,-size*.15);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-size*.4,size*.5);ctx.lineTo(-size*1.1,size*.95);ctx.lineTo(-size*.65,size*.15);ctx.closePath();ctx.stroke();}
    if(idx>=2){ctx.strokeStyle='#fff5';ctx.lineWidth=1.5;for(let i=0;i<4;i++){let a=G.gameTime*.05+i*Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*size*1.35,Math.sin(a)*size*1.05);ctx.stroke();}}
    if(idx>=3){ctx.fillStyle='#ff220088';ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*size*1.2,Math.sin(a)*size*.95);}ctx.closePath();ctx.fill();ctx.strokeStyle='#f80';ctx.stroke();}
  }else if(evoLine==='cryobot'){
    ctx.fillStyle='#041018';ctx.strokeStyle=c;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-size*1.05);ctx.lineTo(size*.82,0);ctx.lineTo(0,size*1.05);ctx.lineTo(-size*.82,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#fff9';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(0,-size*.7);ctx.lineTo(0,size*.7);ctx.moveTo(-size*.55,0);ctx.lineTo(size*.55,0);ctx.stroke();
    ctx.fillStyle=c+'66';ctx.beginPath();ctx.arc(0,0,size*.32,0,Math.PI*2);ctx.fill();
    if(idx>=1){ctx.strokeStyle='#aef';ctx.lineWidth=1.5;ctx.strokeRect(-size*.55,-size*.35,size*1.1,size*.7);}
    if(idx>=2){for(let i=0;i<6;i++){let a=i*Math.PI/3+G.gameTime*.04;ctx.beginPath();ctx.moveTo(Math.cos(a)*size*.4,Math.sin(a)*size*.4);ctx.lineTo(Math.cos(a)*size*1.25,Math.sin(a)*size*1.25);ctx.stroke();}}
    if(idx>=3){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,size*.85,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff2';ctx.beginPath();ctx.arc(0,0,size*.2,0,Math.PI*2);ctx.fill();}
  }else if(evoLine==='voltek'){
    ctx.fillStyle='#141200';ctx.strokeStyle=c;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(size*1.05,0);ctx.lineTo(-size*.55,size*.9);ctx.lineTo(-size*.75,0);ctx.lineTo(-size*.55,-size*.9);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#fff8';ctx.beginPath();ctx.moveTo(-size*.2,-size*.25);ctx.lineTo(size*.45,0);ctx.lineTo(-size*.2,size*.25);ctx.stroke();
    if(idx>=1){ctx.fillStyle=c+'88';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(-size*.35,size*.55*i,size*.12,0,Math.PI*2);ctx.fill();}}
    if(idx>=2){ctx.strokeStyle='#ff8';ctx.lineWidth=1.5;for(let i=0;i<5;i++){let a=-Math.PI/2+i*.55+Math.sin(G.gameTime*.2)*.1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*size*1.3,Math.sin(a)*size*1.3);ctx.stroke();}}
    if(idx>=3){ctx.fillStyle='#ffff4422';ctx.beginPath();ctx.arc(size*.15,0,size*.55,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();}
  }else if(evoLine==='titan'){
    ctx.fillStyle='#121418';ctx.strokeStyle=c;ctx.lineWidth=2.5;
    ctx.fillRect(-size*.75,-size*.9,size*1.5,size*1.8);ctx.strokeRect(-size*.75,-size*.9,size*1.5,size*1.8);
    ctx.fillStyle=c+'44';ctx.fillRect(-size*.55,-size*.55,size*1.1,size*.45);
    ctx.fillStyle='#223';ctx.beginPath();ctx.arc(0,-size*.25,size*.28,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9ef';ctx.stroke();
    let swords=ev.swordCount||1;
    if(swords>=1)drawRobotSword(ctx,size*1.05,c,1);
    if(swords>=2)drawRobotSword(ctx,size*.95,c,-1);
    if(swords>=3)drawRobotSword(ctx,size*.88,c,0);
    if(idx>=1){ctx.fillStyle=c+'66';ctx.fillRect(-size*.95,-size*.15,size*.35,size*.95);ctx.fillRect(size*.6,-size*.15,size*.35,size*.95);}
    if(idx>=3){ctx.strokeStyle='#ffe566';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,size*.55,size*.7,Math.PI,0);ctx.stroke();}
  }

  ctx.restore();resetCtx(ctx);
}

function addSwordSwipe(angle,range,sweep,color,special){
  if(!G.swordSwipes)G.swordSwipes=[];
  if(G.swordSwipes.length>=MAX_SWORD_SWIPES)G.swordSwipes.shift();
  G.swordSwipes.push({angle,range,sweep,color,life:14,maxLife:14,special:!!special});
}

function updateSwordSwipes(){
  if(!G.swordSwipes)return;
  for(let i=G.swordSwipes.length-1;i>=0;i--){
    G.swordSwipes[i].life--;
    if(G.swordSwipes[i].life<=0)G.swordSwipes.splice(i,1);
  }
}

function drawSwordSwipe(ctx,px,py,sw){
  if(sw.angle==null||isNaN(sw.angle))return;
  let prog=1-sw.life/sw.maxLife;
  let sweep=sw.sweep||1.05;
  let reach=sw.range*(0.35+prog*0.65);
  let fade=Math.min(1,sw.life/7);
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(sw.angle);
  ctx.globalAlpha=fade*0.38;
  ctx.fillStyle=sw.color;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,reach,-sweep,sweep);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha=fade*0.85;
  ctx.strokeStyle=sw.color;
  ctx.lineWidth=sw.special?4:3;
  ctx.beginPath();
  ctx.arc(0,0,reach,-sweep,sweep);
  ctx.stroke();
  ctx.globalAlpha=fade;
  ctx.fillStyle='#fff9';
  ctx.beginPath();
  ctx.arc(reach,0,4,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  resetCtx(ctx);
}

function drawSwordChargeRing(ctx,px,py,angle,ev){
  let c=getSwordCharge();
  if(c<=0.02)return;
  let sweep=(ev.swordArc||1.05)*getSwordChargeMods().arc;
  let reach=(ev.swordRange||90)*getSwordChargeMods().range;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(angle);
  ctx.globalAlpha=0.12+c*0.2;
  ctx.strokeStyle=ev.color;
  ctx.lineWidth=1.5;
  ctx.setLineDash([5,7]);
  ctx.beginPath();
  ctx.arc(0,0,reach,-sweep,sweep);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  resetCtx(ctx);
}

function drawFood(ctx,x,y,biome,size){
  let b=BIOMES[biome];
  ctx.save();ctx.fillStyle=b.food;
  if(biome===0){ctx.beginPath();ctx.moveTo(x,y-size);ctx.lineTo(x+size*.6,y+size*.5);ctx.lineTo(x-size*.6,y+size*.5);ctx.closePath();ctx.fill();}
  else if(biome===1){ctx.beginPath();ctx.moveTo(x,y-size);ctx.lineTo(x+size*.4,y);ctx.lineTo(x,y+size);ctx.lineTo(x-size*.4,y);ctx.closePath();ctx.fill();}
  else{ctx.beginPath();ctx.arc(x,y,size*.7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff4';ctx.lineWidth=2;ctx.stroke();}
  ctx.restore();
}

function drawEnemyShape(ctx,x,y,e,flash){
  let et=e,size=e.size*(e.boss?1+Math.sin(G.gameTime*.05)*.06:1);
  let freeze=e.freezeTint||0;
  let burning=isEnemyBurning(e);
  ctx.save();ctx.translate(x,y);
  if(flash)ctx.globalAlpha=.5+Math.sin(G.gameTime*.4)*.5;
  if(freeze>0.08){
    ctx.fillStyle=`rgba(60,180,255,${0.35+freeze*0.45})`;
    ctx.beginPath();ctx.arc(0,0,size*1.35,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(180,240,255,${0.5+freeze*0.4})`;
    ctx.lineWidth=2;
    for(let ic=0;ic<6;ic++){
      let a=ic*Math.PI/3+G.gameTime*.02;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*size*.5,Math.sin(a)*size*.5);
      ctx.lineTo(Math.cos(a)*size*1.25,Math.sin(a)*size*1.25);
      ctx.stroke();
    }
  }
  if(burning){
    ctx.shadowColor='#ff6600';
    ctx.shadowBlur=6+Math.min(10,(e.burnUntil-G.gameTime)*0.02);
  }
  let strokeCol=freeze>0.2?'#cef':et.color;
  let fillCol=freeze>0.15?`rgba(100,210,255,${0.55+freeze*0.4})`:et.color+'44';
  if(freeze>0.45){ctx.globalAlpha=0.85+freeze*0.12;}
  ctx.strokeStyle=strokeCol;ctx.lineWidth=2;ctx.fillStyle=fillCol;
  if(et.boss||et.miniBoss){ctx.shadowColor=et.color;ctx.shadowBlur=6;}
  if(et.nexus){
    ctx.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3+G.gameTime*.02;ctx.lineTo(Math.cos(a)*size,Math.sin(a)*size);}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#f0f';ctx.beginPath();ctx.arc(0,0,size*.5,0,Math.PI*2);ctx.stroke();
  }else if(et.turret){
    ctx.fillStyle=et.color+'55';ctx.fillRect(-size*.9,-size*.35,size*1.8,size*.7);
    ctx.strokeRect(-size*.9,-size*.35,size*1.8,size*.7);
    ctx.beginPath();ctx.arc(size*.5,0,size*.45,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.rotate(G.gameTime*.03);
    ctx.strokeStyle='#fff6';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(size*1.1,0);ctx.stroke();
  }else if(et.miniBoss){
    ctx.rotate(Math.PI/4);
    ctx.fillRect(-size*.8,-size*.8,size*1.6,size*1.6);
    ctx.strokeRect(-size*.8,-size*.8,size*1.6,size*1.6);
    ctx.rotate(-Math.PI/4);
    ctx.strokeStyle='#fff5';ctx.stroke();
  }else if(et.boss){
    ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*size,Math.sin(a)*size);}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#fff5';ctx.beginPath();ctx.arc(0,0,size*.55,0,Math.PI*2);ctx.stroke();
  }else if(et.squadLeader){
    ctx.rotate(e.angle||0);
    ctx.beginPath();
    ctx.moveTo(size*1.15,0);
    ctx.lineTo(-size*.8,size*.85);
    ctx.lineTo(-size*.55,0);
    ctx.lineTo(-size*.8,-size*.85);
    ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.strokeStyle='#fff8';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(size*.35,0);ctx.lineTo(-size*.25,0);ctx.stroke();
  }else if(et.squadMinion){
    ctx.rotate(e.angle||0);
    ctx.beginPath();
    ctx.moveTo(size*1.05,0);
    ctx.lineTo(-size*.7,size*.65);
    ctx.lineTo(-size*.7,-size*.65);
    ctx.closePath();
    ctx.fill();ctx.stroke();
  }else{
    ctx.beginPath();ctx.rect(-size,-size,size*2,size*2);ctx.fill();ctx.stroke();
  }
  if(burning){
    ctx.shadowBlur=0;
    let flick=0.75+Math.sin(G.gameTime*.3)*.2;
    for(let f=0;f<5;f++){
      let a=f*(Math.PI*2/5)-Math.PI/2+G.gameTime*.12;
      let fh=size*(0.45+flick*.35);
      ctx.fillStyle=f%2?'#ff5500bb':'#ffcc0066';
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*size*.25,Math.sin(a)*size*.25);
      ctx.quadraticCurveTo(Math.cos(a)*size*.55,Math.sin(a)*size*.55-fh*.5,Math.cos(a)*size*.1,Math.sin(a)*size*.1-fh);
      ctx.closePath();ctx.fill();
    }
    ctx.fillStyle='#ff220044';
    ctx.beginPath();ctx.arc(0,0,size*.85,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();resetCtx(ctx);
}

function drawMapDecor(ctx){
  for(let z of G.mapZones){
    let sx=z.x-G.camX,sy=z.y-G.camY;
    if(sx<-150||sx>gc.width+150||sy<-150||sy>gc.height+150)continue;
    if(z.type==='geyser'){
      z.t+=.05;
      ctx.fillStyle='#ff440033';ctx.beginPath();ctx.arc(sx,sy,z.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ff6600';ctx.lineWidth=2;
      for(let j=0;j<3;j++){let h=20+Math.sin(z.t+j)*15;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(z.t+j*2)*h,sy-Math.abs(Math.sin(z.t+j*2))*h*2);ctx.stroke();}
    }else if(z.type==='safe'){
      ctx.fillStyle='#0f04';ctx.beginPath();ctx.arc(sx,sy,z.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#3f6';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#6f9';ctx.font='12px Courier New';ctx.textAlign='center';
      ctx.fillText('SAFE',sx,sy);ctx.textAlign='left';
    }else if(z.type==='speedpad'||z.type==='iceslide'){
      let fills={0:'#ff880028',1:'#88eeff30',2:'#eeee2230',4:'#ffe87850',5:'#50e8f848'};
      let strokes={0:'#ffaa44',1:'#aaf',2:'#ee8',4:'#a06808',5:'#8ef'};
      let fill=fills[z.biome]!=null?fills[z.biome]:fills[1];
      let stroke=strokes[z.biome]!=null?strokes[z.biome]:strokes[1];
      let bb=speedPadAABB(z);
      let rx=bb.x-G.camX,ry=bb.y-G.camY;
      ctx.fillStyle=fill;ctx.fillRect(rx,ry,bb.w,bb.h);
      ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.setLineDash([6,5]);
      ctx.strokeRect(rx,ry,bb.w,bb.h);ctx.setLineDash([]);
    }else if(z.type==='dome'){
      ctx.fillStyle='#00cfff18';ctx.beginPath();ctx.arc(sx,sy,z.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#8ef';ctx.stroke();
    }else if(z.type==='turbine'){
      z.angle+=.08;
      ctx.strokeStyle='#ffee00aa';ctx.lineWidth=2;
      for(let b=0;b<4;b++){let a=z.angle+b*Math.PI/2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*z.r,sy+Math.sin(a)*z.r);ctx.stroke();}
      ctx.fillStyle='#ff08';ctx.beginPath();ctx.arc(sx,sy,12,0,Math.PI*2);ctx.fill();
    }else if(z.type==='stormarc'){
      z.t+=.04;
      if(Math.floor(z.t*10)%8===0){ctx.strokeStyle='#ff08';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy-z.r);ctx.lineTo(sx+Math.random()*40-20,sy);ctx.lineTo(sx,sy+z.r);ctx.stroke();}
    }else if(z.type==='nexusaltar'){
      ctx.strokeStyle='#f0f6';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(sx,sy,z.r,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#f0f11';ctx.beginPath();ctx.arc(sx,sy,z.r*.6,0,Math.PI*2);ctx.fill();
    }else if(z.type==='pyramid'){
      let hw=z.w*.5,hh=z.h;
      ctx.fillStyle='#c9a22755';ctx.strokeStyle='#e8c040';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sx,sy-hh);ctx.lineTo(sx-hw,sy);ctx.lineTo(sx+hw,sy);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.strokeStyle='#ff660088';ctx.lineWidth=1;
      for(let s=0;s<5;s++){
        let px=sx-hw*.7+s*hw*.35,py=sy-hh*.15-s*hh*.12;
        ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py-10);ctx.stroke();
      }
    }else if(z.type==='coral'){
      z.t=(z.t||0)+.03;
      ctx.fillStyle='#20a88844';ctx.strokeStyle='#5fffd0';
      ctx.lineWidth=2;
      for(let c=0;c<6;c++){
        let a=c*Math.PI/3+z.t;
        ctx.beginPath();ctx.arc(sx+Math.cos(a)*z.r*.5,sy+Math.sin(a)*z.r*.5,z.r*.45,0,Math.PI*2);ctx.fill();ctx.stroke();
      }
    }
  }
  for(let h of G.hazards){
    let sx=h.x-G.camX,sy=h.y-G.camY;
    if(sx<-80||sx>gc.width+80||sy<-80||sy>gc.height+80)continue;
    drawHazard(ctx,h,sx,sy);
  }
}

function drawHazard(ctx,h,sx,sy){
  const PAL={
    lava:{fill:'#ff440055',stroke:'#ff6622'},
    ice:{fill:'#88eeff55',stroke:'#99ddff'},
    storm:{fill:'#eeee2255',stroke:'#ffee44'},
    void:{fill:'#cc00cc55',stroke:'#f0f'}
  };
  let p=PAL[h.subtype]||PAL.lava,r=h.r,spikes=10;
  ctx.save();ctx.translate(sx,sy);
  ctx.fillStyle=p.fill;ctx.strokeStyle=p.stroke;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,r*.52,0,Math.PI*2);ctx.fill();ctx.stroke();
  for(let i=0;i<spikes;i++){
    let a=i*Math.PI*2/spikes;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*.48,Math.sin(a)*r*.48);
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    ctx.stroke();
  }
  ctx.restore();resetCtx(ctx);
}

function spawnParticles(wx,wy,color,count){
  if(!GameSettings.particles)return;
  while(G.particles.length+count>MAX_PARTICLES&&G.particles.length)G.particles.shift();
  for(let i=0;i<count;i++){
    let a=Math.random()*Math.PI*2,sp=1+Math.random()*4;
    G.particles.push({x:wx,y:wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:25+Math.random()*25,color,r:2+Math.random()*3});
  }
}

function spawnDashTrail(wx,wy,bnx,bny,color,count){
  while(G.particles.length+count>MAX_PARTICLES&&G.particles.length)G.particles.shift();
  let base=Math.atan2(bny,bnx);
  for(let i=0;i<count;i++){
    let a=base+(Math.random()-0.5)*0.85;
    let sp=1.5+Math.random()*3.5;
    G.particles.push({
      x:wx+(Math.random()-0.5)*10*bnx,y:wy+(Math.random()-0.5)*10*bny,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:18+Math.random()*16,color,r:2+Math.random()*2.5
    });
  }
}

function spawnFloat(wx,wy,text,color,crit){
  if(G.floatTexts.length>25)G.floatTexts.shift();
  G.floatTexts.push({x:wx,y:wy,vy:-1.2,life:40,text,color,crit});
}

function spawnPickup(x,y,dropTier){
  let chance=dropTier==='boss'?.55:dropTier==='mini'?.32:dropTier==='elite'?.15:.06;
  if(Math.random()>chance)return;
  let types=['speed','overcharge'];
  let type=types[Math.floor(Math.random()*types.length)];
  let p=clampSpawnPos(x,y,11);
  G.pickups.push({x:p.x,y:p.y,type,life:700,r:11,label:PICKUP_META[type].name});
}

// === COMBAT ===
function dmgMult(){return G.overchargeT>0?2:1;}

function applyIceHit(e){
  if(!e.iceStacks)e.iceStacks=0;
  e.iceStacks=Math.min(ICE_SLOW_MAX/ICE_SLOW_PER_HIT,e.iceStacks+1);
  e.iceSlow=Math.min(ICE_SLOW_MAX,e.iceStacks*ICE_SLOW_PER_HIT);
  e.freezeTint=Math.min(1,e.iceStacks/9);
  e.slowT=Math.max(e.slowT||0,50);
}

function applyFireHit(e){
  e.burnUntil=G.gameTime+BURN_DURATION;
  e.burnStacks=(e.burnStacks||0)+1;
}

function isEnemyBurning(e){
  return e.burnUntil&&G.gameTime<e.burnUntil;
}

function getEvo4WeaponMods(ev){
  if(!ev||ev.meleeOnly||G.evoIdx!==3)return {dmg:1,r:1,life:1,spd:1};
  return {dmg:1.3,r:1.35,life:1.45,spd:1.08};
}

function buildLightningPoints(x0,y0,x1,y1){
  let pts=[{x:x0,y:y0}],segs=7;
  for(let i=1;i<segs;i++){
    let t=i/segs;
    let x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;
    let perp=Math.atan2(y1-y0,x1-x0)+Math.PI/2;
    let jag=(Math.random()-.5)*(28-i*2.5);
    pts.push({x:x+Math.cos(perp)*jag,y:y+Math.sin(perp)*jag});
  }
  pts.push({x:x1,y:y1});
  return pts;
}

function spawnLightningArc(x0,y0,x1,y1,color){
  if(!G.lightningArcs)G.lightningArcs=[];
  if(G.lightningArcs.length>14)G.lightningArcs.shift();
  G.lightningArcs.push({points:buildLightningPoints(x0,y0,x1,y1),life:16,color:color||'#e8f4ff',width:2.2});
}

function voltekArcFromEnemy(source,dmg){
  if(G.evoLine!=='voltek')return;
  let best=null,bestD=VOLT_ARC_RANGE;
  for(let o of G.enemies){
    if(o===source||o.hp<=0)continue;
    let d=Math.hypot(o.x-source.x,o.y-source.y);
    if(d>0&&d<bestD){bestD=d;best=o;}
  }
  if(!best)return;
  dealDamageToEnemy(best,dmg*0.38,true);
  spawnLightningArc(source.x,source.y,best.x,best.y,'#fff9c8');
  spawnLightningArc(source.x,source.y,best.x,best.y,'#88ccff');
  if(G.particles.length<MAX_PARTICLES-4){
    for(let k=0;k<3;k++){
      let t=k/3;
      G.particles.push({
        x:source.x+(best.x-source.x)*t,y:source.y+(best.y-source.y)*t,
        vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,
        life:8+Math.random()*6,color:'#ffee88',r:1.5+Math.random()
      });
    }
  }
  AudioFX.voltArc();
}

function applyBulletElement(e,bullet){
  if(!bullet||bullet.owner!=='player')return;
  if(bullet.kind==='ice'||(G.evoLine==='cryobot'&&bullet.kind==='norm'))applyIceHit(e);
  if(bullet.kind==='fire'||(G.evoLine==='pyrox'&&bullet.kind==='norm'))applyFireHit(e);
  if(G.evoLine==='voltek'&&bullet.kind!=='ice'&&bullet.kind!=='fire'){
    voltekArcFromEnemy(e,bullet.dmg);
  }
}

function spawnBurnParticle(ex,ey,r){
  if(G.particles.length>=MAX_PARTICLES)return;
  let a=Math.random()*Math.PI*2,d=Math.random()*r*.7;
  G.particles.push({
    x:ex+Math.cos(a)*d,y:ey+Math.sin(a)*d-4,
    vx:(Math.random()-.5)*0.8,vy:-0.8-Math.random()*1.2,
    life:14+Math.random()*10,color:Math.random()<.5?'#ff6600':'#ffaa22',r:2+Math.random()*2
  });
}

function getEnemySpeedMult(e){
  if(e.iceSlow>0)return Math.max(0.2,1-e.iceSlow);
  if(e.slowT>0)return 0.55;
  return 1;
}

function dealDamageToEnemy(e,raw,fromBullet){
  let crit=Math.random()<CRIT_CHANCE;
  let dmg=raw*(crit?CRIT_MULT:1)*dmgMult();
  if(e.iceSlow>0||e.slowT>0)dmg*=1.08;
  e.hp-=dmg;
  e.hitFlash=12;
  spawnFloat(e.x,e.y-e.size,Math.round(dmg).toString(),crit?'#ff0':e.color,crit);
  e.lastHitTime=G.gameTime;
  if(fromBullet)AudioFX.hitEnemy(crit);
  if(e.hp<=0)killEnemy(e,fromBullet);
  else if(e.boss||e.miniBoss||e.turret)updateBossPhase(e);
  return dmg;
}

function releaseSquadMinions(leader){
  if(!leader||!leader.squadMinions)return;
  for(let m of leader.squadMinions){
    if(!G.enemies.includes(m))continue;
    m.squadId=null;
    m.state='chase';
  }
  leader.squadMinions=[];
}

function detachSquadOnDeath(e){
  if(e.isSquadLeader)releaseSquadMinions(e);
  else if(e.squadId){
    let L=getSquadLeader(e);
    if(L&&L.squadMinions)L.squadMinions=L.squadMinions.filter(m=>m!==e);
  }
}

function killEnemy(e,fromBullet){
  detachSquadOnDeath(e);
  AudioFX.killEnemy(e);
  if(e.turret)unlockOuterRegions();
  if(e.boss||e.turret)completeBossQuest();
  let xpGain=getKillXp(e);
  G.xp+=xpGain;G.kills++;
  spawnFloat(e.x,e.y-e.size-20,'+'+xpGain+' XP','#5f5',false);
  let enGain=e.en||(e.boss||e.nexus?45:e.miniBoss?22:e.size>16?12:5);
  G.energy=Math.min(G.maxEnergy,G.energy+enGain);
  spawnFloat(e.x,e.y-e.size-8,'+'+enGain+' EN','#ff8',false);
  if(G.relicBonus.killHp>0)G.hp=Math.min(G.maxHp,G.hp+G.relicBonus.killHp);
  spawnParticles(e.x,e.y,e.color,e.boss||e.nexus?25:12);
  let tier=e.boss||e.nexus?'boss':e.miniBoss?'mini':e.size>=17?'elite':'normal';
  spawnPickup(e.x,e.y,tier);
  G.enemies=G.enemies.filter(x=>x!==e);
  document.getElementById('killcount').textContent=G.kills;
  G.combo++;G.comboTimer=COMBO_TIMEOUT;
  checkLevelUp();checkQuests();
  if(G.kills>=50&&!G.nexusSpawned)trySpawnNexus();
}

function updateBossPhase(e){
  if(!e.maxHp)return;
  let r=e.hp/e.maxHp;
  let np=r<.4?3:r<.7?2:1;
  if(np!==e.phase){e.phase=np;showMsg(e.name+' — фаза '+np+'!');G.shakeT=15;}
}

function spawnBullet(x,y,angle,opts){

    dmg:opts.dmg,color:opts.color,r:opts.r||4,life:opts.life||80,kind:opts.kind||'norm',owner:opts.owner||'player',
    pierce:opts.pierce||0,homing:!!opts.homing,homingTarget:opts.target||null,homingPassed:false,homingTurn:opts.homingTurn||0.1});

function getWeaponSpread(ev,special){
  if(ev.meleeOnly)return 0;
  let sp=special?ev.spread*1.3:ev.spread;
  if(G.evoIdx===1)return sp;
  if(G.evoIdx>=2)sp*=0.5;
  if(G.evoIdx>=3)sp*=0.5;
  return sp;
}

function fireWeaponPattern(ev,angle,dmg,special){
  let kind=ev.kind||(G.evoLine==='pyrox'?'fire':G.evoLine==='cryobot'?'ice':'volt');
  let col=ev.color;
  let n=special?ev.pellets+1:ev.pellets;
  let spread=getWeaponSpread(ev,special);
  let m4=getEvo4WeaponMods(ev);
  let spd=(ev.weapon==='shotgun'?9:ev.weapon==='cannon'?12:11)*m4.spd;
  let r=(ev.weapon==='shotgun'?3.5:ev.weapon==='cannon'?5:4)*m4.r;
  let life=Math.floor((ev.weapon==='shotgun'?45:65)*m4.life);
  let dmgEach=dmg*m4.dmg/(ev.weapon==='shotgun'?n*.85:ev.weapon==='dual'?n*.9:n);
  if(ev.weapon==='cannon'){
    spawnBullet(G.px,G.py,angle,{speed:spd,dmg:dmgEach,color:col,r:r+1,life,kind});
    return;
  }
  let start=-spread*(n-1)/2;
  let jitter=spread>0?spread*.04:0;
  for(let i=0;i<n;i++){
    let a=angle+start+spread*i+(Math.random()-.5)*jitter;
    spawnBullet(G.px,G.py,a,{speed:spd*(.96+Math.random()*.06),dmg:dmgEach,color:col,r,life,kind});
  }
}

function spawnCompanionDrone(){
  let off=G.drones.length*0.9;
  G.drones.push({
    x:G.px+Math.cos(off)*42,y:G.py+Math.sin(off)*42,
    hp:COMPANION_DRONE.maxHp,maxHp:COMPANION_DRONE.maxHp,
    shootCd:15,alive:true,respawnT:0,spawnAlpha:0,angle:off,lastHitT:0
  });
}

function spawnHomingDroneBullet(x,y,angle,opts){
  spawnBullet(x,y,angle,{speed:opts.speed,dmg:opts.dmg,color:opts.color,r:opts.r,life:opts.life,
    kind:'norm',owner:'drone',homing:true,target:opts.target,homingTurn:COMPANION_DRONE.homingTurn});
}

function updateCompanionDrones(ev){
  if(!G.drones||!G.drones.length)return;
  for(let d of G.drones){
    if(!d.alive){
      d.respawnT--;
      d.spawnAlpha=Math.min(1,(d.spawnAlpha||0)+0.025);
      if(d.respawnT<=0){
        d.alive=true;
        d.hp=d.maxHp;
        d.x=G.px+(Math.random()-.5)*36;
        d.y=G.py+(Math.random()-.5)*36;
        d.spawnAlpha=0;
        d.shootCd=20;
      }
      continue;
    }
    d.spawnAlpha=Math.min(1,(d.spawnAlpha||0)+0.06);
    d.angle=(d.angle||0)+0.04;
    let orbit=COMPANION_DRONE.followDist;
    let tx=G.px+Math.cos(d.angle)*orbit,ty=G.py+Math.sin(d.angle)*orbit;
    d.x+=(tx-d.x)*0.1;d.y+=(ty-d.y)*0.1;
    let tgt=null,best=COMPANION_DRONE.range;
    for(let e of G.enemies){
      if(e.hp<=0)continue;
      let dd=Math.hypot(e.x-d.x,e.y-d.y);
      if(dd<best){best=dd;tgt=e;}
    }
    if(d.alive){
      if(G.gameTime-(d.lastHitT||0)>DRONE_REGEN_DELAY&&d.hp<d.maxHp){
        d.hp=Math.min(d.maxHp,d.hp+COMPANION_DRONE.regenPerFrame);
      }
      if(G.inSafeZone&&d.hp<d.maxHp){
        d.hp=Math.min(d.maxHp,d.hp+COMPANION_DRONE.safeRegen);
      }
    }
    d.shootCd--;
    if(tgt&&d.shootCd<=0&&!G.inSafeZone&&G.bullets.length<MAX_BULLETS-1){
      d.shootCd=COMPANION_DRONE.shootCd;
      let a=Math.atan2(tgt.y-d.y,tgt.x-d.x);
      spawnHomingDroneBullet(d.x,d.y,a,{
        speed:COMPANION_DRONE.bulletSpeed,
        dmg:ev.atk*COMPANION_DRONE.dmgMult*getPlayerAtkMult(),
        color:'#6f6',r:3.5,life:75,target:tgt
      });
    }
  }
}

function damageCompanionDrone(d,amt){
  if(!d.alive)return;
  d.lastHitT=G.gameTime;
  d.hp-=amt;
  if(d.hp<=0){
    d.alive=false;
    d.respawnT=DRONE_RESPAWN_FRAMES;
    d.spawnAlpha=0;
    spawnParticles(d.x,d.y,'#5f5',10);
  }
}

function getMeleeCooldown(ev,special){
  let base=ev.meleeCd||18;
  return Math.max(6,Math.floor(base*getPlayerFireMult()*(special?1.15:1)));
}

function hitEnemiesInSwordArc(angle,range,dmg,arcWidth,ev){
  let hit=0;
  let reach=range+(ev&&ev.size?ev.size*0.55:12);
  for(let e of G.enemies){
    let dx=e.x-G.px,dy=e.y-G.py,d=Math.hypot(dx,dy);
    if(d>reach+(e.size||10))continue;
    let ea=Math.atan2(dy,dx);
    let diff=Math.atan2(Math.sin(ea-angle),Math.cos(ea-angle));
    if(Math.abs(diff)<=arcWidth){
      dealDamageToEnemy(e,dmg,false);
      hit++;
    }
  }
  return hit;
}

function playerSword(angle,special){
  if(G.inSafeZone)return;
  let ev=EVOS[G.evoLine][G.evoIdx];
  if(!ev.meleeOnly)return;
  if(G.meleeCd>0)return;
  let enCost=getTitanEnCost(ev);
  if(G.energy<enCost)return;
  G.energy-=enCost;
  let charge=getSwordChargeMods();
  G.meleeCd=getMeleeCooldown(ev,special);
  G.lastShootAngle=angle;
  G.playerState='melee';G.animT=0;G.swordAnimMax=16;
  let range=(ev.swordRange||90)*charge.range;
  let swords=ev.swordCount||1;
  let arcBase=(ev.swordArc||1.02)*charge.arc*(special?1.05:1);
  let arc=arcBase+(swords>1?(swords-1)*0.12:0);
  let dmg=ev.atk*charge.dmg*(special?1.45:1)*getPlayerAtkMult();
  G.px+=Math.cos(angle)*4;G.py+=Math.sin(angle)*4;
  G.shakeT=special?7:4;
  addSwordSwipe(angle,range,arc,ev.color,special);
  for(let s=0;s<swords;s++){
    let off=(s-(swords-1)/2)*0.5;
    hitEnemiesInSwordArc(angle+off,range,dmg/(swords>1?0.9:1),arc,ev);
  }
  if(G.particles.length<MAX_PARTICLES-6){
    let tipX=G.px+Math.cos(angle)*range*.5,tipY=G.py+Math.sin(angle)*range*.5;
    spawnParticles(tipX,tipY,ev.color,swords>=3?5:7);
  }
  AudioFX.melee();
}

function playerShoot(angle,special){
  if(G.inSafeZone)return;
  let ev=EVOS[G.evoLine][G.evoIdx];
  if(ev.meleeOnly){playerSword(angle,special);return;}
  let enCost=special?ev.enCost+6:ev.enCost;
  if(G.shootCd>0)return;
  if(G.energy<enCost){if(G.energy<=0&&!ev.meleeOnly)tryMelee();return;}
  G.energy-=enCost;
  G.shootCd=getFireCooldown(ev,special);
  G.lastShootAngle=angle;
  G.playerState='shoot';G.animT=0;
  let dmg=ev.atk*(special?1.35:1)*getPlayerAtkMult();
  let kick=ev.weapon==='shotgun'?3:special?3:2;
  G.px-=Math.cos(angle)*kick;G.py-=Math.sin(angle)*kick;
  G.shakeT=ev.weapon==='shotgun'?5:special?5:2;
  spawnParticles(G.px,G.py,ev.color,ev.weapon==='shotgun'?8:4);
  fireWeaponPattern(ev,angle,dmg,special);
  if(special&&G.evoLine==='voltek')chainLightning(G.px,G.py,dmg*.5,2+G.evoIdx);
  if(special&&G.evoLine==='cryobot'&&G.evoIdx>=2){
    for(let e of G.enemies)if(Math.hypot(e.x-G.px,e.y-G.py)<120)e.slowT=60;
  }
  AudioFX.playerShoot(G.evoLine,special,ev.weapon);
}

function chainLightning(x,y,dmg,chains){
  let targets=G.enemies.map(e=>({e,d:Math.hypot(e.x-x,e.y-y)})).filter(t=>t.d<220).sort((a,b)=>a.d-b.d).slice(0,chains);
  let lastX=x,lastY=y;
  for(let t of targets){
    dealDamageToEnemy(t.e,dmg*.35,true);
    spawnLightningArc(lastX,lastY,t.e.x,t.e.y,'#fff6a0');
    lastX=t.e.x;lastY=t.e.y;
  }
}

function tryMelee(){
  if(G.meleeCd>0)return;
  let ev=EVOS[G.evoLine][G.evoIdx];
  for(let e of [...G.enemies]){
    let d=Math.hypot(e.x-G.px,e.y-G.py);
    if(d<ev.size+e.size+14){
      dealDamageToEnemy(e,ev.atk*.4*getPlayerAtkMult(),false);
      G.meleeCd=MELEE_CD;G.shakeT=5;spawnParticles(e.x,e.y,ev.color,6);
      AudioFX.melee();
    }
  }
}

function energyNodeBlast(){
  if(G.nodeCd>0||G.energy<25)return;
  G.energy-=25;G.nodeCd=NODE_CD;G.shakeT=18;
  let ev=EVOS[G.evoLine][G.evoIdx];
  spawnParticles(G.px,G.py,ev.color,35);
  for(let e of [...G.enemies]){
    if(Math.hypot(e.x-G.px,e.y-G.py)<180)dealDamageToEnemy(e,ev.atk*2.2*getPlayerAtkMult(),true);
  }
  showMsg('Энерго-удар!');
  AudioFX.nodeBlast();
}

function spawnEnemyAt(ex,ey,et,biome,mult,opts){
  opts=opts||{};
  et={...et};
  let sp=clampSpawnPos(ex,ey,et.size||12);
  ex=sp.x;ey=sp.y;
  mult=mult||1+G.level*.07+(biome===3?0.35:0);
  et.hp*=mult;et.maxHp=et.hp;et.atk*=mult;
  if(!et.en)et.en=et.boss?40:et.miniBoss?18:et.squadLeader?14:6;
  let pt=pickLocalPatrol(ex,ey,et.size||12);
  let state=opts.forceChase?'chase':'patrol';
  let enemy={...et,x:ex,y:ey,biome,angle:0,state,
    patrolTarget:{x:pt.x,y:pt.y},
    slowT:0,burnT:0,burnUntil:0,hitFlash:0,phase:1,iceStacks:0,iceSlow:0,freezeTint:0,burnStacks:0,
    meleeCd:et.meleeSword?20:0,meleeCdBase:et.meleeCd||50,
    attackCd:et.turret?75+Math.random()*25:50+Math.random()*40,
    shootCdBase:et.shootCd||100,
    shootCd:et.shooter?50+Math.random()*60:9999,
    spawnGrace:opts.noSpawnGrace?0:90};
  if(opts.squadId)enemy.squadId=opts.squadId;
  if(opts.isSquadLeader)enemy.isSquadLeader=true;
  if(opts.squadSlot!=null)enemy.squadSlot=opts.squadSlot;

  if(et.boss||et.miniBoss){showMsg('⚠ '+et.name+'!');G.shakeT=12;}

  else if(et.boss)AudioFX.bossSpawn('boss');
  else if(et.miniBoss)AudioFX.bossSpawn('mini');
  return enemy;
}

function spawnSquad(biome,mult){
  if(G.enemies.length>20)return false;
  let pos=randomSpawnInBiome(biome);
  for(let t=0;t<18;t++){
    if(Math.hypot(pos.x-G.px,pos.y-G.py)>=260)break;
    pos=randomSpawnInBiome(biome);
  }
  let col=SQUAD_BIOME_COLORS[biome]||'#ff5588';
  let squadId='sq_'+G.gameTime+'_'+Math.floor(Math.random()*9999);
  let commander={...SQUAD_COMMANDER_BASE,name:'Tri-Commander',color:col};
  let leader=spawnEnemyAt(pos.x,pos.y,commander,biome,mult,{squadId,isSquadLeader:true,forceChase:false});
  leader.squadMinions=[];
  for(let i=0;i<SQUAD_DRONE_COUNT;i++){
    let a=i/SQUAD_DRONE_COUNT*Math.PI*2+Math.random()*.4;
    let dist=95+Math.random()*35;
    let dx=pos.x+Math.cos(a)*dist;
    let dy=pos.y+Math.sin(a)*dist;
    let drone={...SQUAD_DRONE_BASE,name:'Tri-Drone',color:col};
    let m=spawnEnemyAt(dx,dy,drone,biome,mult*0.9,{squadId,squadSlot:i,forceChase:false});
    leader.squadMinions.push(m);
  }
  showMsg('⚠ Отряд '+commander.name+'!');
  G.shakeT=8;
  AudioFX.bossSpawn('mini');
  return true;
}

function spawnEnemyInExtension(){
  if(!G.regionsUnlocked||G.enemies.length>34)return;
  let extBi=Math.random()<0.5?4:5;
  let etArr=ENEMY_TYPES_EXT[extBi-4];
  let roll=Math.random(),et;
  if(roll<.14)et={...etArr[4]};
  else if(roll<.38)et={...etArr[3]};
  else if(roll<.62)et={...etArr[2]};
  else et={...etArr[1]};
  let pos=randomSpawnInExtBiome(extBi);
  if(Math.hypot(pos.x-G.px,pos.y-G.py)<200){
    for(let t=0;t<15;t++){
      pos=randomSpawnInExtBiome(extBi);
      if(Math.hypot(pos.x-G.px,pos.y-G.py)>=200)break;
    }
  }
  spawnEnemyAt(pos.x,pos.y,et,extBi,1.2+G.level*0.07);
}

function spawnEnemy(forceBoss){
  let inCore=Math.random()<.12+G.level*.01;
  let biome,ex,ey,mult=1;
  if(G.regionsUnlocked&&!forceBoss&&!inCore&&Math.random()<0.42){
    spawnEnemyInExtension();
    return;
  }
  if(inCore&&!forceBoss){
    biome=3;
    let a=Math.random()*Math.PI*2,d=Math.random()*CORE_ZONE.r*.85;
    ex=CORE_ZONE.cx+Math.cos(a)*d;ey=CORE_ZONE.cy+Math.sin(a)*d;
    let pool=CORE_ENEMIES;
    let roll=Math.random(),et;
    if(roll<.06&&G.level>=5)et={...pool[3]};
    else if(roll<.25)et={...pool[2]};
    else if(roll<.5)et={...pool[1]};
    else et={...pool[0]};
    spawnEnemyAt(ex,ey,et,biome,mult+0.4);
    return;
  }
  biome=Math.floor(Math.random()*3);
  if(!forceBoss&&G.level>=2&&Math.random()<SQUAD_SPAWN_CHANCE){
    if(spawnSquad(biome,mult))return;
  }
  let b=BIOME_BOUNDS[biome];
  let tier=G.level<4?0:G.level<8?1:G.level<12?2:3;
  let roll=Math.random(),etArr=ENEMY_TYPES[biome],et;
  if(forceBoss)et={...etArr[4]};
  else if(roll<.11&&tier>=1)et={...SCRAP_GOLEM};
  else if(roll<.07&&tier>=3)et={...etArr[4]};
  else if(roll<.22&&tier>=2)et={...etArr[3]};
  else if(roll<.45&&tier>=1)et={...etArr[2]};
  else if(roll<.65)et={...etArr[1]};
  else et={...etArr[0]};
  let pos=randomSpawnInBiome(biome);
  ex=pos.x;ey=pos.y;
  if(Math.hypot(ex-G.px,ey-G.py)<220){
    for(let t=0;t<20;t++){
      pos=randomSpawnInBiome(biome);
      if(Math.hypot(pos.x-G.px,pos.y-G.py)>=220){ex=pos.x;ey=pos.y;break;}
    }
  }
  spawnEnemyAt(ex,ey,et,biome,mult);
}

  let dmg=e.atk*0.2*playerDmgScale(e);
  addEnemyBullet({x:e.x,y:e.y,vx:Math.cos(ang+spread)*spd,vy:Math.sin(ang+spread)*spd,
    dmg,life:70,color:e.color,r:2.5});
  AudioFX.enemyShoot(e,0);
}

function updateEnemyMelee(e,d,espd){
  if(e.meleeCd==null)e.meleeCd=0;
  e.meleeCd--;
  if(e.state==='chase'&&d<(e.swordRange||95)){
    if(d<54&&e.meleeCd<=0){
      e.meleeCd=e.meleeCdBase||50;
      applyDamageToPlayer(e.atk*0.52);
      G.shakeT=6;
      e.hitFlash=10;
    }else{
      moveEnemyToward(e,G.px,G.py,espd*1.28,e.size||12);
    }
  }else moveEnemyAI(e,espd,d);
}

function enemyShoot(e){
  if(e.boss||e.nexus||e.turret||e.squadLeader||e.squadMinion||e.meleeSword)return;
  let tier=enemyBulletTier(e);
  let ang=Math.atan2(G.py-e.y,G.px-e.x);
  if(e.ringShot){
    for(let i=0;i<6;i++)fireEnemyBullet(e.x,e.y,ang+i*Math.PI/3,e,tier+1);
    return;
  }
  if(e.burstCount){
    for(let i=0;i<e.burstCount;i++){
      let spread=(i-(e.burstCount-1)/2)*0.1;
      fireEnemyBullet(e.x,e.y,ang+spread,e,tier);
    }
    return;
  }
  let n=(tier>=2||e.miniBoss)?2:1;
  if(e.spreadShot)n=3;
  for(let i=0;i<n;i++){
    let spread=(i-(n-1)/2)*(.12+tier*.05+(e.spreadShot?0.08:0));
    fireEnemyBullet(e.x,e.y,ang+spread,e,tier);
  }
}

function fireTurretBullet(ex,ey,ang,e){
  let spd=6;
  let life=100;
  addEnemyBullet({x:ex,y:ey,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
    dmg:e.atk*.19*playerDmgScale(e),life,color:e.color,r:8});
}

function turretAttack(e){
  AudioFX.bossAttack();
  let ang=Math.atan2(G.py-e.y,G.px-e.x);
  let n=4+Math.min(2,e.phase);
  for(let i=0;i<n;i++){
    let spread=(i-(n-1)/2)*0.14;
    fireTurretBullet(e.x,e.y,ang+spread,e);
  }
  fireTurretBullet(e.x,e.y,ang,e);
}

function updateDash(){
  if(!G.dashActive)return;
  G.dashT++;
  let t=Math.min(1,G.dashT/G.dashDur);
  let ease=1-Math.pow(1-t,2.6);
  G.px=G.dashFromX+(G.dashToX-G.dashFromX)*ease;
  G.py=G.dashFromY+(G.dashToY-G.dashFromY)*ease;
  G.camTX=G.px-gc.width/2;
  G.camTY=G.py-gc.height/2;
  if(G.dashT%3===0){
    let ev=EVOS[G.evoLine][G.evoIdx];
    let behind=ev.size*1.1;
    spawnDashTrail(G.px-G.dashNx*behind,G.py-G.dashNy*behind,-G.dashNx,-G.dashNy,ev.color,4);
  }
  if(t>=1)G.dashActive=false;
}

function playerBoost(fromRmb){
  if(!G.running||G.paused||G.inSafeZone)return;
  if(G.dashCd>0||G.dashActive)return;
  let enCost=fromRmb?14:20;
  if(G.energy<enCost)return;
  let aim=aimFromPlayer();
  let d=aim.dist||1;
  let nx=aim.dx/d,ny=aim.dy/d;
  let dist=fromRmb?95:112;
  let cp=clampMapPos(G.px+nx*dist,G.py+ny*dist,20);
  G.dashFromX=G.px;G.dashFromY=G.py;
  G.dashToX=cp.x;G.dashToY=cp.y;
  G.dashNx=nx;G.dashNy=ny;
  G.dashT=0;G.dashDur=fromRmb?11:13;
  G.dashActive=true;
  G.energy-=enCost;G.dashCd=fromRmb?42:55;
  G.playerState='dash';
  let ev=EVOS[G.evoLine][G.evoIdx];
  spawnDashTrail(G.px-nx*ev.size*1.2,G.py-ny*ev.size*1.2,-nx,-ny,ev.color,8);
  AudioFX.dash(fromRmb);
}

function initQuests(){
  G.quests=[
    {id:'kill30',text:'Убей 30 врагов',target:30,progress:0,done:false,rewardXp:55},
    {id:'boss',text:'Победи босса биома',target:1,progress:0,done:false,rewardXp:90}
  ];
  updateQuestHud();
}

function updateQuestHud(){
  let el=document.getElementById('quest-hud');
  if(!el)return;
  el.innerHTML=G.quests.map(q=>{
    let cls=q.done?'q-done':'q-active';
    let line=(q.done?'✓ ':'○ ')+q.text;
    if(!q.done)line+=' ('+Math.min(q.progress,q.target)+'/'+q.target+')';
    return '<div class="'+cls+'">'+line+'</div>';
  }).join('');
}

function completeQuest(q){
  if(!q||q.done)return;
  q.done=true;
  q.progress=q.target;
  if(q.rewardXp>0){
    G.xp+=q.rewardXp;
    showMsg('Квест: '+q.text+' (+'+q.rewardXp+' XP)');
    checkLevelUp();
  }else showMsg('Квест: '+q.text+'!');
  updateQuestHud();
}

function checkQuests(){
  let q=G.quests.find(x=>x.id==='kill30');
  if(q&&!q.done){
    q.progress=G.kills;
    if(q.progress>=q.target)completeQuest(q);
    else updateQuestHud();
    return;
  }
  updateQuestHud();
}

function completeBossQuest(){
  let q=G.quests.find(x=>x.id==='boss');
  if(q&&!q.done){q.progress=1;completeQuest(q);}
}

// === INIT ===
function initGame(type){
  resetGameState();
  G.playerType=type;G.evoLine=type;G.evoIdx=0;
  let biomeMap={pyrox:0,cryobot:1,voltek:2,titan:0};
  G.biomeIdx=biomeMap[type];
  let sp=randomSpawnInBiome(G.biomeIdx);
  G.px=sp.x;G.py=sp.y;
  G.camX=G.px-gc.width/2;G.camY=G.py-gc.height/2;G.camTX=G.camX;G.camTY=G.camY;

  buildMapZones();initQuests();
  for(let i=0;i<60;i++)spawnFood();
  for(let i=0;i<16;i++)spawnEnemy();
  spawnCoreTurret();
  G.running=true;G.gameTime=0;G.paused=false;
  G.shield=0;
  syncPlayerEnergy(true);
  G.lastDamageTime=0;
  G.upgradePanelHideAt=0;
  document.getElementById('pause-overlay').style.display='none';
